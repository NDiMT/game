<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>town view</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block}
#panel{position:absolute;left:6px;right:6px;bottom:6px;border-radius:18px;background:rgba(20,22,40,0.88);color:#fff;font:14px sans-serif;padding:12px;box-sizing:border-box}
#info{position:absolute;left:8px;top:8px;color:#fff;font:12px monospace;text-shadow:0 1px 2px #000}</style>
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.js" } }</script></head><body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { gradeGLSL } from '../atmosphere.js';
import { tick } from '../materials.js';
import { createTownView, TOWN_SLOTS } from '../town_view.js';
const q = new URLSearchParams(location.search);
const fac = q.get('fac') || 'haven';
const ALL = ['hall3', 'fort', 'market', 'tavern', 'mage3', 'u1', 'd2', 'u3', 'd4', 'u5', 'd6', 'u7'];
const MID = ['hall2', 'fort', 'tavern', 'mage1', 'd1', 'd2', 'd3', 'd4'];
let built = q.get('built') === 'none' ? [] : q.get('built') === 'mid' ? MID : q.get('built') ? q.get('built').split(',') : ALL;
const panelFrac = q.has('panel') ? +q.get('panel') : 0.45;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
// same post chain as main.js
const post = (() => {
  const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)), quadScene = new THREE.Scene(); quadScene.add(quad);
  const opts = { type: THREE.HalfFloatType, depthBuffer: false };
  const rtScene = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }), rtA = new THREE.WebGLRenderTarget(1, 1, opts), rtB = new THREE.WebGLRenderTarget(1, 1, opts);
  const vs = 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
  const bright = new THREE.ShaderMaterial({ uniforms: { tMap: { value: null } }, vertexShader: vs, depthTest: false, fragmentShader: 'uniform sampler2D tMap; varying vec2 vUv; void main() { vec3 c = texture2D(tMap, vUv).rgb; float l = max(c.r, max(c.g, c.b)); gl_FragColor = vec4(c * smoothstep(0.9, 1.7, l), 1.0); }' });
  const blur = new THREE.ShaderMaterial({ uniforms: { tMap: { value: null }, uDir: { value: new THREE.Vector2() } }, vertexShader: vs, depthTest: false, fragmentShader: 'uniform sampler2D tMap; uniform vec2 uDir; varying vec2 vUv; void main() { vec3 c = texture2D(tMap, vUv).rgb * 0.227; c += (texture2D(tMap, vUv + uDir * 1.38).rgb + texture2D(tMap, vUv - uDir * 1.38).rgb) * 0.316; c += (texture2D(tMap, vUv + uDir * 3.23).rgb + texture2D(tMap, vUv - uDir * 3.23).rgb) * 0.07; gl_FragColor = vec4(c, 1.0); }' });
  const comp = new THREE.ShaderMaterial({ uniforms: { tScene: { value: null }, tBloom: { value: null } }, vertexShader: vs, depthTest: false, fragmentShader: `uniform sampler2D tScene; uniform sampler2D tBloom; varying vec2 vUv;
${gradeGLSL}
void main() { vec3 c = texture2D(tScene, vUv).rgb + texture2D(tBloom, vUv).rgb * 0.8; c = grade(c); c = c / (1.0 + c * 0.12); float v = smoothstep(1.15, 0.35, length(vUv - 0.5)); c *= mix(0.72, 1.0, v); gl_FragColor = vec4(c, 1.0);
#include <tonemapping_fragment>
#include <colorspace_fragment>
}` });
  let w = 1, hh = 1;
  return { setSize(W, H, pr) { w = W * pr; hh = H * pr; rtScene.setSize(w, hh); rtA.setSize(w / 2, hh / 2); rtB.setSize(w / 2, hh / 2); },
    render(sc, cm) { renderer.setRenderTarget(rtScene); renderer.render(sc, cm); const tm = renderer.toneMapping; renderer.toneMapping = THREE.NoToneMapping; quad.material = bright; bright.uniforms.tMap.value = rtScene.texture; renderer.setRenderTarget(rtA); renderer.render(quadScene, quadCam); quad.material = blur;
      for (let i = 0; i < 2; i++) { blur.uniforms.tMap.value = rtA.texture; blur.uniforms.uDir.value.set(2 / w, 0); renderer.setRenderTarget(rtB); renderer.render(quadScene, quadCam); blur.uniforms.tMap.value = rtB.texture; blur.uniforms.uDir.value.set(0, 2 / hh); renderer.setRenderTarget(rtA); renderer.render(quadScene, quadCam); }
      renderer.toneMapping = tm; quad.material = comp; comp.uniforms.tScene.value = rtScene.texture; comp.uniforms.tBloom.value = rtA.texture; renderer.setRenderTarget(null); renderer.render(quadScene, quadCam); } };
})();
const tv = createTownView(THREE, renderer);
tv.setInsets({ bottom: panelFrac });
if (panelFrac > 0 && !q.has('nopanel')) { const p = document.createElement('div'); p.id = 'panel'; p.style.height = (panelFrac * 100) + '%'; p.textContent = 'town panel'; document.body.appendChild(p); }
function resize() { renderer.setSize(innerWidth, innerHeight); post.setSize(innerWidth, innerHeight, renderer.getPixelRatio()); tv.resize(innerWidth, innerHeight); }
addEventListener('resize', resize); resize();
tv.setTown({ fac, built, name: 'Preview' });
if (q.get('hl')) tv.highlight(q.get('hl'));
let tt = 0;
const step = (dt) => { tt += dt; tick(tt); tv.update(dt); };
renderer.domElement.addEventListener('pointerup', (e) => { const id = tv.pick(e.clientX, e.clientY); document.getElementById('info').textContent = 'pick: ' + id; tv.highlight(id); });
window.TV = { tv, step, render: () => post.render(tv.scene, tv.camera), build(id) { built = [...built, id]; tv.setTown({ fac, built, name: 'Preview' }); }, renderer, TOWN_SLOTS, V3: THREE.Vector3, H: { fort: 2, hall3: 3, u7: 4, mage3: 3.8, d6: 2.6, u5: 2.6, d4: 2.2, tavern: 1.7, market: 1.4, u1: 1.7, d2: 1.9, u3: 2.3 } };
if (q.has('live')) { const clk = new THREE.Clock(); (function loop() { step(Math.min(0.05, clk.getDelta())); post.render(tv.scene, tv.camera); renderer.info.reset; document.getElementById('info').textContent ||= ''; requestAnimationFrame(loop); })(); }
else { for (let i = 0; i < 40; i++) step(1 / 30); post.render(tv.scene, tv.camera); }
document.title = 'calls ' + renderer.info.render.calls + ' tris ' + renderer.info.render.triangles;
window.DONE = true;
</script></body></html>
