<!doctype html><html><head><meta charset="utf-8"><title>dungeon town</title>
<style>body{margin:0;background:#8a78b8;overflow:hidden;font:12px sans-serif}canvas{display:block}.lb{position:absolute;color:#fff;text-shadow:0 0 3px #000;transform:translate(-50%,0)}</style>
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.js" } }</script></head><body>
<script type="module">
import * as THREE from 'three';
import { dungeonTownBuilding as townBuilding, DUNGEON_TOWN_IDS as TOWN_IDS } from '../dungeon_town.js';
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'grid';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8f80c4);
const sun = new THREE.DirectionalLight(0xfff0f4, 2.6); sun.position.set(8, 14, 10); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, far: 60 }); sun.shadow.bias = -0.0005;
scene.add(sun, new THREE.HemisphereLight(0xd8ccff, 0x7a8aa8, 1.15));
const bodyMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.8 });
const glowMat = new THREE.MeshBasicMaterial({ vertexColors: true, toneMapped: false }); glowMat.color.setScalar(1.6);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x9a90b4 })); ground.receiveShadow = true; scene.add(ground);
function meshOf(m) { const g = new THREE.Group(); const b = new THREE.Mesh(m.body, bodyMat); b.castShadow = b.receiveShadow = true; g.add(b); if (m.glow) g.add(new THREE.Mesh(m.glow, glowMat)); return g; }
const tris = {}; const placed = [];
function place(id, x, z, ry = 0, s = 1) {
  const m = townBuilding(id); const g = meshOf(m); g.position.set(x, 0, z); g.rotation.y = ry; g.scale.setScalar(s); scene.add(g);
  tris[id] = Math.round(m.body.attributes.position.count / 3 + (m.glow ? m.glow.attributes.position.count / 3 : 0));
  placed.push([id, g]); return g;
}
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 200);
if (mode === 'grid') {
  const only = q.get('ids') ? q.get('ids').split(',') : TOWN_IDS.filter((i) => i !== 'fort');
  const cols = +(q.get('cols') || 6), sp = +(q.get('sp') || 4.2);
  only.forEach((id, i) => place(id, ((i % cols) - (cols - 1) / 2) * sp, Math.floor(i / cols) * sp, +(q.get('rot') || 0)));
  if (!q.get('ids')) place('fort', 0, -3.6);
  const rows = Math.ceil(only.length / cols);
  const cz = (rows - 1) * sp * 0.5; const d = +(q.get('dist') || 24);
  const el = +(q.get('el') || 0.62); camera.position.set(0, d * el, cz + d * 0.85); camera.lookAt(0, 0.8, cz);
} else {
  // mock HoMM3-style panorama
  // the real town_view slot layout (x, z, ry)
  const L = { fort: [0, -5.1, 0], hall3: [0, -2.6, 0], u7: [-3.4, -2.8, 0.18], mage3: [3.4, -2.6, -0.18], u6: [-4.5, 0.05, 0.25], u5: [-2.2, 0.15, 0.08],
    u4: [2.2, 0.15, -0.08], tavern: [4.5, 0.05, -0.25], market: [-3.35, 2.75, 0.2], u1: [-1.12, 2.8, 0.06], u2: [1.12, 2.8, -0.06], u3: [3.35, 2.75, -0.2] };
  if (q.get('base')) Object.assign(L, { hall2: L.hall3, mage1: L.mage3 }, Object.fromEntries([1,2,3,4,5,6,7].map((t) => ['d' + t, L['u' + t]])));
  if (q.get('base')) for (const id of ['hall3', 'mage3', 'u1', 'u2', 'u3', 'u4', 'u5', 'u6', 'u7']) delete L[id];
  for (const [id, [x, z, ry]] of Object.entries(L)) place(id, x, z, ry);
  for (let i = 0; i < 14; i++) { const t = new THREE.Mesh(new THREE.IcosahedronGeometry(0.6, 1), new THREE.MeshStandardMaterial({ color: 0x8a76b8, flatShading: true })); t.position.set(-9 + i * 1.4, 0.6, -7.2 + Math.sin(i) * 0.6); t.scale.set(1, 2.2, 1); t.castShadow = true; scene.add(t); }
  camera.fov = +(q.get('fov') || 46); camera.updateProjectionMatrix();
  camera.position.set(0, 8, 15); camera.lookAt(0, 0.6, -0.8);
}
renderer.render(scene, camera);
if (q.get('labels') !== '0') for (const [id, g] of placed) { const v = g.position.clone().setY(-0.1).project(camera); const d = document.createElement('div'); d.className = 'lb'; d.textContent = id + ' ' + tris[id]; d.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; d.style.top = ((1 - v.y) / 2 * innerHeight) + 'px'; document.body.appendChild(d); }
document.title = JSON.stringify(tris);
window.DONE = true;
</script></body></html>
