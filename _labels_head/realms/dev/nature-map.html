<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nature Map Test</title>
<style>html,body{margin:0;background:#20242c;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { makeBodyMaterial, makeGlowMaterial } from '../materials.js';
import { natureModel, FLORA_FOR_TERRAIN, FOREST_BY_BIOME, PEAK_BY_BIOME, biomeOf } from '../nature.js';
const q = new URLSearchParams(location.search);
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H); renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a1020);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4); sun.position.set(3, 6, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, far: 20 });
scene.add(sun, new THREE.HemisphereLight(0xbcd4ff, 0x3a3020, 0.8), new THREE.AmbientLight(0x404a70, 0.35));
const bodyMat = makeBodyMaterial(THREE);
const glowMat = makeGlowMaterial(THREE);
const TER_COL = [0x2a5a9a, 0x5aaa3a, 0x9a7a4a, 0xe2cc8a, 0xeef4f8, 0x4a6a3a, 0x9a8a6a, 0x5a3430, 0x7a6e64, 0x3e7e34];
// hex grid, spacing like the game (about 0.35)
const S = 0.35, N = 9, cells = [];
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const regions = [[-2.2, -1.6, 1], [0.2, -2, 9], [2.2, -1.4, 8], [-2.4, 0.6, 3], [0, 0.2, 1], [2.4, 0.8, 4], [-1.6, 2.4, 5], [0.8, 2.4, 7], [2.8, 2.6, 6], [-0.6, -0.8, 2], [-3, -0.5, 0]];
for (let r = -N; r <= N; r++) for (let c = -N; c <= N; c++) {
  const x = (c + r * 0.5) * S, z = r * S * 0.866;
  if (Math.abs(x) > 3.6 || Math.abs(z) > 3.6) continue;
  let best = 0, bd = 1e9;
  regions.forEach(([rx, rz], i) => { const d = Math.hypot(x - rx + Math.sin(z * 3) * 0.3, z - rz + Math.cos(x * 3) * 0.3); if (d < bd) { bd = d; best = i; } });
  cells.push({ x, z, t: regions[best][2] });
}
const hexG = new THREE.CylinderGeometry(S * 0.577, S * 0.577, 0.06, 6).translate(0, -0.03, 0);
const hexM = new THREE.InstancedMesh(hexG, new THREE.MeshStandardMaterial({ flatShading: true }), cells.length);
const dummy = new THREE.Object3D(), col = new THREE.Color();
cells.forEach((cl, i) => { dummy.position.set(cl.x, cl.t === 0 ? -0.05 : 0, cl.z); dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(0.985); dummy.updateMatrix(); hexM.setMatrixAt(i, dummy.matrix); hexM.setColorAt(i, col.set(TER_COL[cl.t])); });
hexM.receiveShadow = true; scene.add(hexM);
// scatter exactly as the lead would
const lists = new Map();
const put = (key, x, z, s, turn) => { if (!lists.has(key)) lists.set(key, []); dummy.position.set(x, 0, z); dummy.rotation.set(0, turn, 0); dummy.scale.setScalar(s); dummy.updateMatrix(); lists.get(key).push(dummy.matrix.clone()); };
const pickW = (arr) => { let t = arr.reduce((a, e) => a + (e.w ?? 1), 0) * rnd(); for (const e of arr) { t -= e.w ?? 1; if (t <= 0) return e.key ?? e; } return arr[0].key ?? arr[0]; };
const near = (cl) => cells.filter((o) => o !== cl && Math.hypot(o.x - cl.x, o.z - cl.z) < S * 1.1).map((o) => o.t);
for (const cl of cells) {
  const F = FLORA_FOR_TERRAIN[cl.t]; if (!F) continue;
  if (cl.t === 9) {
    const mixw = FOREST_BY_BIOME[biomeOf(near(cl))];
    const n = F.count[0] + ((rnd() * (F.count[1] - F.count[0] + 1)) | 0);
    for (let i = 0; i < n; i++) { const a = i * 2.4 + rnd(), rr = i ? 0.09 : 0.0; put(pickW(mixw), cl.x + Math.cos(a) * rr, cl.z + Math.sin(a) * rr, F.fillScale * (0.85 + rnd() * 0.3), rnd() * 6.28); }
  } else if (cl.t === 8) {
    const b = biomeOf(near(cl)); const list = PEAK_BY_BIOME[b] || PEAK_BY_BIOME.temperate;
    put(list[(rnd() * list.length) | 0], cl.x, cl.z, F.fillScale * (0.9 + rnd() * 0.2), rnd() * 6.28);
  }
  let placed = 0;
  for (const e of F.scatter) if (placed < 2 && rnd() < e.p) { const a = rnd() * 6.28, rr = 0.04 + rnd() * 0.06; put(e.key, cl.x + Math.cos(a) * rr, cl.z + Math.sin(a) * rr, e.s, rnd() * 6.28); placed++; }
}
let draws = 0;
for (const [key, m] of lists) {
  const model = natureModel(key);
  const im = new THREE.InstancedMesh(model.body, bodyMat, m.length); m.forEach((x, i) => im.setMatrixAt(i, x)); im.castShadow = im.receiveShadow = true; scene.add(im); draws++;
  if (model.glow) { const ig = new THREE.InstancedMesh(model.glow, glowMat, m.length); m.forEach((x, i) => ig.setMatrixAt(i, x)); scene.add(ig); draws++; }
}
console.log('draws', draws, 'keys', lists.size);
const cam = new THREE.PerspectiveCamera(42, W / H, 0.05, 100);
const d = +(q.get('d') || 5.2), ph = +(q.get('ph') || 0.85);
cam.position.set(0, Math.cos(ph) * d, Math.sin(ph) * d); cam.lookAt(0, 0, 0.2);
renderer.render(scene, cam);
window.READY = true;
</script></body></html>
