<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Necropolis Upgrades</title>
<style>html,body{margin:0;background:#5a7a9a;color:#fff;font:12px sans-serif;overflow:hidden}#info{position:fixed;left:6px;top:4px;white-space:pre;pointer-events:none;z-index:2;text-shadow:0 1px 2px #000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three.module.js"}}</script>
</head><body><div id="info"></div>
<script type="module">
// ?id=a,b  ?pair=1 (base beside upgrade)  ?a=angle  ?cols=n
import * as THREE from 'three';
const v = '?v=' + Date.now();
const { necroUpModel, NECRO_UP_IDS } = await import('../units_necro_up.js' + v);
const { necroModel } = await import('../units_necro.js' + v);
const { makeBodyMaterial, makeGlowMaterial, tick } = await import('../materials.js' + v);
const BASE = { skelwarrior: 'skeleton', plaguezombie: 'zombie', wraith: 'wight', vampirelord: 'vampire', powerlich: 'lich', dreadknight: 'blackknight', ghostdragon: 'bonedragon' };
const Q = new URLSearchParams(location.search);
let ids = Q.get('id') ? Q.get('id').split(',') : NECRO_UP_IDS;
const list = [];
for (const id of ids) { if (Q.has('pair')) list.push(['base', BASE[id]]); list.push(['up', id]); }
const fixedAngle = Q.has('a') ? +Q.get('a') : null;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);
const bodyMat = makeBodyMaterial(THREE), glowMat = makeGlowMaterial(THREE);
const scene = new THREE.Scene();
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4); sun.position.set(3, 5, 4); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x4a3a2a, 0.9)); scene.add(new THREE.AmbientLight(0x404a70, 0.3));
const ground = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.02, 32), new THREE.MeshStandardMaterial({ color: 0x6a8a4a, roughness: 1 })); ground.position.y = -0.01; scene.add(ground);
const models = []; let txt = '';
for (const [kind, id] of list) {
  const m = kind === 'up' ? necroUpModel(id) : necroModel(id), g = new THREE.Group();
  g.add(new THREE.Mesh(m.body, bodyMat)); if (m.glow) g.add(new THREE.Mesh(m.glow, glowMat));
  const bb = new THREE.Box3().setFromObject(g), sz = bb.getSize(new THREE.Vector3());
  const tris = (m.body.attributes.position.count + (m.glow ? m.glow.attributes.position.count : 0)) / 3;
  txt += `${id}: ${tris} tris  h=${sz.y.toFixed(2)} w=${sz.x.toFixed(2)} d=${sz.z.toFixed(2)}\n`;
  g.visible = false; scene.add(g); models.push({ g, sz });
}
document.getElementById('info').textContent = txt; window.__info = txt;
const cam = new THREE.PerspectiveCamera(30, 1, 0.05, 50);
const n = models.length, cols = Q.get('cols') ? +Q.get('cols') : (n === 1 ? 1 : Math.ceil(Math.sqrt(n * innerWidth / innerHeight))), rows = Math.ceil(n / cols);
// common scale per tile so sizes compare honestly
const S = Q.has('fit') ? null : Math.max(...models.map((o) => Math.max(o.sz.y, o.sz.z * 0.7, o.sz.x * 0.7)));
function frame(t) {
  tick(t / 1000);
  const W = innerWidth, H = innerHeight, cw = W / cols, ch = H / rows;
  models.forEach((o, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    renderer.setViewport(c * cw, H - (r + 1) * ch, cw, ch); renderer.setScissor(c * cw, H - (r + 1) * ch, cw, ch);
    renderer.setClearColor(0x5a7a9a + ((c + r) % 2) * 0x060606);
    models.forEach((q) => q.g.visible = false); o.g.visible = true;
    o.g.rotation.y = fixedAngle !== null ? fixedAngle : t * 0.0006 + 0.5;
    const s = S ?? Math.max(o.sz.y, o.sz.z * 0.7, o.sz.x * 0.7);
    cam.aspect = cw / ch; cam.updateProjectionMatrix();
    cam.position.set(0, s * 0.9, s * 3.2); cam.lookAt(0, s * 0.45, 0);
    ground.scale.setScalar(Math.max(1, s));
    renderer.render(scene, cam);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
