<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORBIS Music</title>
<style>
  :root { --bg: #14121a; --fg: #ece6d8; --mut: #9a92a8; --btn: #262233; --on: #c9a34e; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--mut); margin: 4px 0 14px; }
  table { border-collapse: collapse; width: 100%; max-width: 760px; }
  th { text-align: left; color: var(--mut); font-weight: 500; padding: 4px; font-size: 13px; }
  td { padding: 3px; }
  button { width: 100%; padding: 10px 4px; border: 0; border-radius: 6px; background: var(--btn); color: var(--fg); font: inherit; font-size: 13px; cursor: pointer; }
  button.on { background: var(--on); color: #1a1406; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; max-width: 760px; }
  .row button { width: auto; padding: 10px 16px; }
  #status { font-family: ui-monospace, monospace; font-size: 12px; color: var(--mut); white-space: pre-wrap; }
  canvas { width: 100%; max-width: 760px; height: 36px; background: #0c0b10; border-radius: 6px; }
</style>
</head>
<body>
<h1>ORBIS: Five Crowns soundtrack</h1>
<p>Every scene × faction. Victory and defeat are one-shot stingers that return to the map.</p>
<div class="row">
  <button id="play">Start</button><button id="stopb">Stop</button>
  <label>Volume <input id="vol" type="range" min="0" max="1" step="0.01" value="0.55"></label>
</div>
<table id="grid"></table>
<canvas id="meter" width="760" height="36"></canvas>
<div id="status">idle</div>
<script type="module">
import { createScore, FACTIONS, SCENES, __test } from '../music.js';

let ac = null, score = null, vol = null, an = null;
const $ = (id) => document.getElementById(id);
function boot() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  vol = ac.createGain(); vol.gain.value = +$('vol').value;
  an = ac.createAnalyser(); an.fftSize = 2048;
  vol.connect(an); vol.connect(ac.destination);
  score = createScore(ac, vol);
  draw();
}
const grid = $('grid');
grid.innerHTML = '<tr><th></th>' + FACTIONS.map((f) => `<th>${f}</th>`).join('') + '</tr>' +
  SCENES.map((s) => `<tr><th>${s}</th>` + FACTIONS.map((f) => `<td><button data-s="${s}" data-f="${f}">${s === 'menu' ? 'main theme' : s}</button></td>`).join('') + '</tr>').join('');
grid.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  boot(); ac.resume();
  score.setScene(b.dataset.s, b.dataset.f); score.start();
  for (const x of grid.querySelectorAll('button')) x.classList.toggle('on', x === b);
});
$('play').onclick = () => { boot(); ac.resume(); score.start(); };
$('stopb').onclick = () => score && score.stop();
$('vol').oninput = () => vol && (vol.gain.value = +$('vol').value);
function draw() {
  const c = $('meter'), g = c.getContext('2d'), d = new Float32Array(an.fftSize);
  (function f() {
    an.getFloatTimeDomainData(d);
    let pk = 0, s = 0; for (const x of d) { pk = Math.max(pk, Math.abs(x)); s += x * x; }
    const rms = Math.sqrt(s / d.length);
    g.clearRect(0, 0, c.width, c.height);
    g.fillStyle = '#6a8'; g.fillRect(0, 4, c.width * Math.min(1, rms * 4), 12);
    g.fillStyle = pk > 0.98 ? '#e55' : '#c9a34e'; g.fillRect(0, 20, c.width * Math.min(1, pk), 12);
    $('status').textContent = `scene ${score.scene} / ${score.faction}   playing ${score.playing}   rms ${(20 * Math.log10(rms + 1e-9)).toFixed(1)} dB   peak ${(20 * Math.log10(pk + 1e-9)).toFixed(1)} dB`;
    requestAnimationFrame(f);
  })();
}

// ---- headless verification: render a scene offline and measure it
// script: [[atSeconds, scene, faction], ...] lets a test exercise crossfades and stingers
window.renderScene = async (script, seconds = 25, wantWav = false) => {
  const SR = 44100, oac = new OfflineAudioContext(2, SR * seconds, SR);
  const sc = createScore(oac, oac.destination);
  for (const [, s, f] of script) await sc.preload(s, f);
  let t = 0; sc._useClock(() => t);
  let k = 0;
  for (; t <= seconds; t += 0.2) {
    while (k < script.length && script[k][0] <= t) { sc.setScene(script[k][1], script[k][2]); if (k === 0) sc.start(); k++; }
    sc._tick();
  }
  const buf = await oac.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1), win = SR / 2;
  let peak = 0, sum = 0, clip = 0; const wins = [];
  for (let i = 0; i < L.length; i++) { const a = Math.max(Math.abs(L[i]), Math.abs(R[i])); if (a > peak) peak = a; if (a >= 0.999) clip++; sum += L[i] * L[i] + R[i] * R[i]; }
  for (let w = 0; w + win <= L.length; w += win) { let s = 0; for (let i = w; i < w + win; i++) s += L[i] * L[i] + R[i] * R[i]; wins.push(Math.sqrt(s / win / 2)); }
  const db = (x) => +(20 * Math.log10(x + 1e-9)).toFixed(1);
  const after = wins.slice(6); // ignore the 3 s fade-in
  const res = { peakDb: db(peak), rmsDb: db(Math.sqrt(sum / L.length / 2)), clip, minWinDb: db(Math.min(...after)), maxWinDb: db(Math.max(...after)), quietWins: after.filter((x) => x < 0.003).length, winsDb: wins.map(db) };
  if (wantWav) {
    const n = L.length, ab = new ArrayBuffer(44 + n * 4), v = new DataView(ab);
    const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    ws(0, 'RIFF'); v.setUint32(4, 36 + n * 4, true); ws(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
    v.setUint32(24, SR, true); v.setUint32(28, SR * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, n * 4, true);
    for (let i = 0; i < n; i++) { v.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true); v.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true); }
    const bytes = new Uint8Array(ab); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    res.wav = btoa(bin);
  }
  return res;
};
window.__test = __test;
</script>
</body>
</html>
