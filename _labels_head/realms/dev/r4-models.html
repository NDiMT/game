<!doctype html>
<html><head><meta charset="utf-8"><title>R4 model readability</title>
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.js" } }</script>
<style>html,body{margin:0;background:#3a4a30;color:#fff;font:12px sans-serif}canvas{display:block;image-rendering:pixelated}#l{position:fixed;left:4px;top:2px;white-space:pre;font-size:11px}</style>
</head><body><div id="l"></div>
<script type="module">
// R4 preview: models at map scale (game SCALE), map-like camera, ink hull + contact blob.
// ?rows=old,new (module sets) &ids=hero:haven:0x3a7aff,obj:chest,town:haven &ppu=pixels per unit at render
// &up=css upscale (pixelated) &phi=camera angle from vertical &bg=ground colour
import * as THREE from 'three';
import { makeBodyMaterial, makeGlowMaterial, makeInkHullMaterial, makeBlobShadowMaterial, blobShadowGeometry, tick } from '../materials.js';
const q = new URLSearchParams(location.search);
const rows = (q.get('rows') || 'old,new').split(',');
const ids = (q.get('ids') || 'hero:haven:0x3a7aff,hero:necro:0xd83a3a,hero:haven:0x38b848,hero:necro:0xe8c020,obj:chest,obj:gold,obj:wood,obj:ore,obj:gems,obj:artifact,obj:campfire').split(',');
const ppu = +(q.get('ppu') || 100), up = +(q.get('up') || 1), phi = +(q.get('phi') || 0.72), sp = +(q.get('sp') || 0.42);
const SCALE = { gold: 0.3, wood: 0.3, ore: 0.3, gems: 0.3, chest: 0.28, artifact: 0.28, town: 0.4, goldmine: 0.3, gemmine: 0.3, orepit: 0.3, sawmill: 0.28, dwelling: 0.3, arena: 0.28, tower: 0.24, library: 0.27, stone: 0.24, obelisk: 0.24, shrine: 0.27, well: 0.27, windmill: 0.27, stables: 0.27, campfire: 0.24 };
const BLOB = { gold: 0.62, wood: 0.62, ore: 0.62, gems: 0.62, chest: 0.64, artifact: 0.55, campfire: 0.6, stone: 0.55 };
const mods = {};
for (const r of rows) {
  const base = r === 'old' ? './shots/r4before/' : '../';
  mods[r] = { t: await import(base + 'models_towns.js?v=' + Date.now()), o: await import(base + 'models_objects.js?v=' + Date.now()) };
}
const cols = ids.length, W = Math.round(cols * sp * ppu + ppu * 0.5), H = Math.round(rows.length * sp * 1.25 * ppu * (q.get('tall') ? +q.get('tall') : 1));
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.domElement.style.width = W * up + 'px'; renderer.domElement.style.height = H * up + 'px';
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(q.get('bg') ? +q.get('bg') : 0x6e8a50);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4); sun.position.set(3, 8, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 0.5, far: 40 }); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
scene.add(sun, new THREE.HemisphereLight(0xbcd4ff, 0x3a3020, 0.8), new THREE.AmbientLight(0x404a70, 0.35));
const bodyMat = makeBodyMaterial(THREE), glowMat = makeGlowMaterial(THREE), inkMat = makeInkHullMaterial(THREE), blobMat = makeBlobShadowMaterial(THREE), blobGeo = blobShadowGeometry(THREE); tick(0);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: scene.background, roughness: 1 }));
ground.receiveShadow = true; scene.add(ground);
let info = '';
const rowZ = sp * 1.1 / Math.cos(phi);
rows.forEach((r, ri) => ids.forEach((id, i) => {
  const [kind, a, b] = id.split(':');
  let m, s, blob = 0.66;
  if (kind === 'hero') { m = mods[r].t.heroModel(a, b ? +b : undefined); s = 0.27; blob = 0.5; }
  else if (kind === 'town') { m = mods[r].t.townModel(a); s = 0.4; }
  else if (kind === 'flag') { m = mods[r].t.flagModel(+a); s = 0.27; }
  else { m = mods[r].o.objectModel(a); s = SCALE[a] || 0.24; blob = BLOB[a] || 0.66; }
  const g = new THREE.Group();
  const bm = new THREE.Mesh(m.body, bodyMat); bm.castShadow = bm.receiveShadow = true; g.add(bm);
  if (m.glow) g.add(new THREE.Mesh(m.glow, glowMat));
  if (q.get('ink') !== '0') g.add(new THREE.Mesh(m.body, inkMat));
  const bl = new THREE.Mesh(blobGeo, blobMat); bl.scale.setScalar(blob); bl.renderOrder = -1; g.add(bl);
  g.scale.setScalar(s * (+q.get('figk') || 1)); g.rotation.y = +(q.get('rot') || 0);
  g.position.set((i - (cols - 1) / 2) * sp * (kind === 'town' ? 1 : 1), 0, (ri - (rows.length - 1) / 2) * rowZ);
  scene.add(g);
  const tris = (m.body.attributes.position.count + (m.glow ? m.glow.attributes.position.count : 0)) / 3;
  if (ri === rows.length - 1 || rows.length === 1) info += `${id}:${tris | 0} `;
  else info += '';
}));
document.getElementById('l').textContent = q.get('info') ? info : '';
console.log('TRIS', info);
const hw = W / ppu / 2, hh = H / ppu / 2, cam = new THREE.OrthographicCamera(-hw, hw, hh, -hh, 0.1, 200);
cam.position.setFromSphericalCoords(10, phi, 0); cam.lookAt(0, 0.05, 0);
cam.position.y += 0.0; renderer.render(scene, cam);
window.DONE = true;
</script></body></html>
