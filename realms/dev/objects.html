<!doctype html>
<html><head><meta charset="utf-8"><title>Map objects</title>
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.js" } }</script>
<style>body{margin:0;background:#1a2030;color:#fff;font:12px sans-serif}#info{position:fixed;left:4px;top:4px;white-space:pre}</style>
</head><body><div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { objectModel, OBJECT_IDS } from '../models_objects.js';
const q = new URLSearchParams(location.search);
const only = q.get('only') ? q.get('only').split(',') : null;
const ids = only || OBJECT_IDS;
const rot = +(q.get('rot') || 0), phi = +(q.get('phi') || 0.95);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a3448);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4); sun.position.set(6, 8, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 0.5, far: 40 }); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
scene.add(sun, new THREE.HemisphereLight(0xbcd4ff, 0x3a3020, 0.8), new THREE.AmbientLight(0x404a70, 0.35));
const bodyMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.75 });
const glowMat = new THREE.MeshBasicMaterial({ vertexColors: true, toneMapped: false }); glowMat.color.setScalar(2.2);
const cols = Math.ceil(Math.sqrt(ids.length)), sp = +(q.get('sp') || 1.6);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x4a8a3a, roughness: 1 }));
ground.receiveShadow = true; scene.add(ground);
let info = '';
ids.forEach((id, i) => {
  const m = objectModel(id);
  const g = new THREE.Group();
  const b = new THREE.Mesh(m.body, bodyMat); b.castShadow = b.receiveShadow = true; g.add(b);
  if (m.glow) g.add(new THREE.Mesh(m.glow, glowMat));
  const rows = Math.ceil(ids.length / cols);
  g.position.set((i % cols - (cols - 1) / 2) * sp, 0, (Math.floor(i / cols) - (rows - 1) / 2) * sp);
  g.rotation.y = rot;
  scene.add(g);
  const tris = (m.body.attributes.position.count + (m.glow ? m.glow.attributes.position.count : 0)) / 3;
  info += `${id}: ${tris} tris\n`;
});
document.getElementById('info').textContent = info;
const cam = new THREE.PerspectiveCamera(only && only.length === 1 ? 30 : 38, innerWidth / innerHeight, 0.05, 100);
const dist = (only && only.length === 1) ? 3.2 : cols * sp * +(q.get('zoom') || 1.45);
cam.position.setFromSphericalCoords(dist, phi, 0); cam.position.y += 0; cam.lookAt(0, only && only.length === 1 ? 0.35 : 0, 0);
renderer.render(scene, cam);
window.DONE = true;
</script></body></html>
