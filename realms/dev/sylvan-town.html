<!doctype html><html><head><meta charset="utf-8"><title>sylvan town</title>
<style>body{margin:0;background:#8fc4f0;overflow:hidden;font:12px sans-serif}canvas{display:block}.lb{position:absolute;color:#fff;text-shadow:0 0 3px #000;transform:translate(-50%,0)}</style>
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.js" } }</script></head><body>
<script type="module">
import * as THREE from 'three';
import { sylvanTownBuilding, SYLVAN_TOWN_IDS } from '../sylvan_town.js';
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'grid';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fd0f5);
const sun = new THREE.DirectionalLight(0xfff2dc, 2.6); sun.position.set(8, 14, 10); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, far: 60 }); sun.shadow.bias = -0.0005;
scene.add(sun, new THREE.HemisphereLight(0xcfe4ff, 0x9a8a5a, 1.1));
const bodyMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.8 });
const glowMat = new THREE.MeshBasicMaterial({ vertexColors: true, toneMapped: false }); glowMat.color.setScalar(1.6);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x86c650 })); ground.receiveShadow = true; scene.add(ground);
function meshOf(m) { const g = new THREE.Group(); const b = new THREE.Mesh(m.body, bodyMat); b.castShadow = b.receiveShadow = true; g.add(b); if (m.glow) g.add(new THREE.Mesh(m.glow, glowMat)); return g; }
const tris = {}; const placed = [];
function place(id, x, z, ry = 0, s = 1) {
  const m = sylvanTownBuilding(id); const g = meshOf(m); g.position.set(x, 0, z); g.rotation.y = ry; g.scale.setScalar(s); scene.add(g);
  tris[id] = Math.round(m.body.attributes.position.count / 3 + (m.glow ? m.glow.attributes.position.count / 3 : 0));
  placed.push([id, g]); return g;
}
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 200);
if (mode === 'grid') {
  const only = q.get('ids') ? q.get('ids').split(',') : SYLVAN_TOWN_IDS.filter((i) => i !== 'fort');
  const cols = +(q.get('cols') || 6), sp = +(q.get('sp') || 4.2), spz = +(q.get('spz') || sp);
  only.forEach((id, i) => place(id, ((i % cols) - (cols - 1) / 2) * sp, Math.floor(i / cols) * spz, +(q.get('rot') || 0)));
  if (!q.get('ids')) place('fort', 0, -3.6);
  const rows = Math.ceil(only.length / cols);
  const cz = (rows - 1) * spz * 0.5; const d = +(q.get('dist') || 24);
  const el = +(q.get('el') || 0.62); camera.position.set(0, d * el, cz + d * 0.85); camera.lookAt(0, +(q.get('ly') || 0.8), cz);
} else {
  // mock HoMM3-style panorama
  const L = { fort: [0, -5.6, 0], hall3: [0, -2.6, 0], u7: [-3.6, -3.4, 0.25], u5: [3.6, -3.3, -0.25], mage3: [-6.4, -2.4, 0.4], u2: [6.4, -2.2, -0.4],
    market: [-2.4, 0.4, 0.2], tavern: [2.3, 0.4, -0.2], u3: [-5.2, 0.9, 0.4], u1: [5.0, 0.9, -0.4], u4: [-3.0, 3.2, 0.3], u6: [3.0, 3.2, -0.3] };
  for (const [id, [x, z, ry]] of Object.entries(L)) place(id, x, z, ry);
  for (let i = 0; i < 14; i++) { const t = new THREE.Mesh(new THREE.IcosahedronGeometry(0.6, 1), new THREE.MeshStandardMaterial({ color: 0x4ea83a, flatShading: true })); t.position.set(-9 + i * 1.4, 0.6, -7 + Math.sin(i) * 0.6); t.castShadow = true; scene.add(t); }
  camera.fov = +(q.get('fov') || 46); camera.updateProjectionMatrix();
  camera.position.set(0, 8, 15); camera.lookAt(0, 0.6, -0.8);
}
renderer.render(scene, camera);
if (q.get('labels') !== '0') for (const [id, g] of placed) { const v = g.position.clone().setY(-0.1).project(camera); const d = document.createElement('div'); d.className = 'lb'; d.textContent = id + ' ' + tris[id]; d.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; d.style.top = ((1 - v.y) / 2 * innerHeight) + 'px'; document.body.appendChild(d); }
document.title = JSON.stringify(tris);
window.DONE = true;
</script></body></html>
