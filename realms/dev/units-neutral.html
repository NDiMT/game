<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neutral Creatures</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a2030; color: #eee; font: 600 13px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #info { position: fixed; left: 8px; top: 6px; pointer-events: none; white-space: pre; }
</style>
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.js" } }</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { neutralModel, NEUTRAL_IDS } from '../units_neutral.js?v='+Date.now();
import { makeBodyMaterial, makeGlowMaterial, tick } from '../materials.js';

// ?id=wolf shows one big; ?a=0.6 fixes the yaw; ?small=1 adds tiny map-guard sized copies
const Q = new URLSearchParams(location.search);
const ids = Q.get('id') ? Q.get('id').split(',') : NEUTRAL_IDS;
const fixed = Q.has('a') ? +Q.get('a') : null;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x6a8ab0);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4); sun.position.set(4, 10, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
scene.add(sun, new THREE.HemisphereLight(0xcfe0ff, 0x4a3a2a, 0.9), new THREE.AmbientLight(0x404a70, 0.3));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x5aaa3a, roughness: 1 }));
ground.receiveShadow = true; scene.add(ground);
const bodyMat = makeBodyMaterial(THREE);
const glowMat = makeGlowMaterial(THREE);
// one viewport per creature, each with its own camera framed on the model
const cols = ids.length === 1 ? 1 : ids.length <= 2 ? 2 : ids.length <= 4 ? 2 : 3;
const rows = Math.ceil(ids.length / cols);
const items = [];
let info = '';
ids.forEach((id, i) => {
  const m = neutralModel(id), g = new THREE.Group();
  const b = new THREE.Mesh(m.body, bodyMat); b.castShadow = b.receiveShadow = true; g.add(b);
  if (m.glow) g.add(new THREE.Mesh(m.glow, glowMat));
  g.position.x = i * 30; // far apart; each viewport looks at its own
  scene.add(g);
  const bb = m.body.boundingBox;
  const tris = (m.body.attributes.position.count + (m.glow ? m.glow.attributes.position.count : 0)) / 3;
  info += `${id}: ${tris} tris  h ${bb.max.y.toFixed(2)}  len ${(bb.max.z - bb.min.z).toFixed(2)}  w ${(bb.max.x - bb.min.x).toFixed(2)}\n`;
  const size = Math.max(bb.max.y, (bb.max.z - bb.min.z) * 0.8, (bb.max.x - bb.min.x) * 0.8);
  const cam = new THREE.PerspectiveCamera(30, 1, 0.05, 100);
  const d = size * 2.3 * (+Q.get('zoom') || 1);
  cam.position.set(i * 30, bb.max.y * 0.5 + d * 0.35, d); cam.lookAt(i * 30, bb.max.y * 0.45, 0);
  items.push({ g, cam, id });
  if (Q.has('small')) { const s = g.clone(); s.scale.setScalar(0.25); s.position.set(i * 30 + size * 0.7, 0, size * 0.5); scene.add(s); items.push({ g: s }); }
});
sun.shadow.camera.left = -(ids.length * 15 + 4); sun.shadow.camera.right = ids.length * 15 + 4;
sun.position.set(ids.length * 15 + 4, 10, 6); sun.target.position.set(ids.length * 15, 0, 0); scene.add(sun.target);
sun.shadow.camera.top = 3; sun.shadow.camera.bottom = -3; sun.shadow.camera.far = 400; sun.shadow.mapSize.set(4096, 512); sun.shadow.camera.updateProjectionMatrix();
ground.geometry = new THREE.PlaneGeometry(ids.length * 30 + 40, 40).rotateX(-Math.PI / 2); ground.position.x = ids.length * 15;
document.getElementById('info').textContent = info;
renderer.setScissorTest(true);
let t = 0;
renderer.setAnimationLoop(() => {
  t += 0.01; tick(t * 3);
  for (const it of items) it.g.rotation.y = fixed ?? t;
  const W = innerWidth / cols, H = innerHeight / rows;
  items.filter((it) => it.cam).forEach((it, i) => {
    const x = (i % cols) * W, y = innerHeight - (((i / cols) | 0) + 1) * H;
    renderer.setViewport(x, y, W, H); renderer.setScissor(x, y, W, H);
    it.cam.aspect = W / H; it.cam.updateProjectionMatrix();
    renderer.render(scene, it.cam);
  });
});
</script>
</body>
</html>
