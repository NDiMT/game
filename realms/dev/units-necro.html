<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Necropolis Units</title>
<style>html,body{margin:0;background:#1a1d2e;color:#ddd;font:12px sans-serif;overflow:hidden}#info{position:fixed;left:6px;top:4px;white-space:pre;pointer-events:none;z-index:2}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three.module.js"}}</script>
</head><body><div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { necroModel, NECRO_IDS } from '../units_necro.js';
const Q = new URLSearchParams(location.search);
const ids = Q.get('id') ? Q.get('id').split(',') : NECRO_IDS;
const fixedAngle = Q.has('a') ? +Q.get('a') : null;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);
const bodyMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.75 });
const glowMat = new THREE.MeshBasicMaterial({ vertexColors: true, toneMapped: false }); glowMat.color.setScalar(2.2);
const scene = new THREE.Scene();
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4); sun.position.set(3, 5, 4); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x3a3020, 0.8)); scene.add(new THREE.AmbientLight(0x404a70, 0.35));
const ground = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.02, 32), new THREE.MeshStandardMaterial({ color: 0x4a5a3a, roughness: 1 })); ground.position.y = -0.01; scene.add(ground);
const models = []; let txt = '';
for (const id of ids) {
  const m = necroModel(id), g = new THREE.Group();
  g.add(new THREE.Mesh(m.body, bodyMat)); if (m.glow) g.add(new THREE.Mesh(m.glow, glowMat));
  const bb = new THREE.Box3().setFromObject(g), sz = bb.getSize(new THREE.Vector3());
  const tris = (m.body.attributes.position.count + (m.glow ? m.glow.attributes.position.count : 0)) / 3;
  txt += `${id}: ${tris} tris  h=${sz.y.toFixed(2)} w=${sz.x.toFixed(2)} d=${sz.z.toFixed(2)}\n`;
  g.visible = false; scene.add(g); models.push({ g, sz });
}
document.getElementById('info').textContent = txt; window.__info = txt;
const cam = new THREE.PerspectiveCamera(30, 1, 0.05, 50);
const n = models.length, cols = n === 1 ? 1 : (Q.get('cols') ? +Q.get('cols') : Math.ceil(Math.sqrt(n * innerWidth / innerHeight)) ), rows = Math.ceil(n / cols);
function frame(t) {
  const W = innerWidth, H = innerHeight, cw = W / cols, ch = H / rows;
  models.forEach((o, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    renderer.setViewport(c * cw, H - (r + 1) * ch, cw, ch); renderer.setScissor(c * cw, H - (r + 1) * ch, cw, ch);
    renderer.setClearColor(0x1a1d2e + ((c + r) % 2) * 0x050505);
    models.forEach((q) => q.g.visible = false); o.g.visible = true;
    o.g.rotation.y = fixedAngle !== null ? fixedAngle : t * 0.0006 + 0.5;
    const s = Math.max(o.sz.y, o.sz.z * 0.7, o.sz.x * 0.7);
    cam.aspect = cw / ch; cam.updateProjectionMatrix();
    cam.position.set(0, s * 0.9, s * 3.2); cam.lookAt(0, s * 0.45, 0);
    ground.scale.setScalar(Math.max(1, s));
    renderer.render(scene, cam);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
