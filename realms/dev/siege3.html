<!doctype html>
<html><head><meta charset="utf-8"><title>Siege preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#111;overflow:hidden;font:12px sans-serif}canvas{display:block}
.hud{position:fixed;left:0;right:0;background:rgba(40,60,120,.55);color:#fff;padding:4px}
.lab{position:fixed;left:0;top:0;font:bold 11px sans-serif;color:#fff;padding:0 4px;border-radius:5px;transform-origin:0 0;margin:-8px 0 0 -9px}
.s0{background:#2a5ad0}.s1{background:#c83a3a}</style>
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.js" } }</script>
</head><body><div class="hud" style="top:0;height:62px">HUD</div><div class="hud" style="bottom:0;height:96px">buttons</div>
<script type="module">
import * as THREE from 'three';
import { createBattlefield, wallModel, towerModel, gateModel, keepModel, siegeLayout } from '../battlefield.js';
import { havenModel } from '../units_haven.js';
import { necroModel } from '../units_necro.js';
import { unitModel } from '../models.js';
import * as BT from '../battle.js';
import { UNITS } from '../data.js';
const Q = new URLSearchParams(location.search);
const fac = Q.get('fac') || 'haven', terr = +(Q.get('t') || 1), def = +(Q.get('def') ?? 1), dist = +(Q.get('dist') || 12.5), yaw = +(Q.get('yaw') || 0);
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const { COLS, ROWS } = BT;
const HS = 0.5, HW = Math.sqrt(3) * HS, VS = 1.5 * HS;
const hexPos = (c, r) => new THREE.Vector3((c - (COLS - 1) / 2 + (r & 1 ? 0.5 : 0) - 0.25) * HW, 0, (r - (ROWS - 1) / 2) * VS);
const bodyMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.75 });
const glowMat = new THREE.MeshBasicMaterial({ vertexColors: true, toneMapped: false }); glowMat.color.setScalar(2.2);
const meshOf = (m) => { const g = new THREE.Group(); const b = new THREE.Mesh(m.body, bodyMat); b.castShadow = b.receiveShadow = true; g.add(b); if (m.glow) g.add(new THREE.Mesh(m.glow, glowMat)); return g; };
const scene = new THREE.Scene();
const bf = createBattlefield(THREE, terr, hexPos, COLS, ROWS); scene.add(bf.group);
scene.background = new THREE.Color(bf.sky); scene.fog = new THREE.Fog(bf.fog.color, bf.fog.near, bf.fog.far);
const L = bf.lights;
const sun = new THREE.DirectionalLight(L.sun.color, L.sun.intensity); sun.position.set(4, 10, 3); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 }); sun.shadow.bias = -0.0005;
scene.add(sun, new THREE.HemisphereLight(L.hemi.sky, L.hemi.ground, L.hemi.intensity * 1.15), new THREE.AmbientLight(L.ambient.color, L.ambient.intensity + 0.12));
renderer.toneMappingExposure = L.exposure;
const ids = Object.keys(UNITS).filter((id) => !UNITS[id].up);
const pickArmy = (o) => Array.from({ length: 6 }, (_, i) => [ids[(i * 3 + o) % ids.length], 5 + i * 7]);
const B = BT.createBattle({ armyA: pickArmy(1), armyB: pickArmy(2), town: { fort: true, side: def, power: 3 } });
// ---- the main.js enterBattle siege snippet (verbatim apart from cached()/bstuff/bctx)
const bstuff = new THREE.Group(); scene.add(bstuff); const bctx = {};
const sfac = fac;
const lay = B.walls.size ? siegeLayout(hexPos, BT.COLS, BT.ROWS, B.town.side ?? 1) : null;
if (bf.keepZone) bf.keepZone.visible = !lay?.keep;
for (const k of B.obstacles) {
  const c = k % BT.COLS, r = (k / BT.COLS) | 0;
  if (B.walls.has(k)) { const w = meshOf(wallModel(sfac)); w.position.copy(hexPos(c, r)); w.rotation.y = lay.wallRotY; bstuff.add(w); continue; }
  const m = meshOf(bf.obstacleModel(k % 3)); m.position.copy(hexPos(c, r)); m.rotation.y = k; bstuff.add(m);
}
if (lay) {
  if (B.gate != null) { const g = meshOf(gateModel(sfac)); g.position.copy(hexPos(B.gate % BT.COLS, (B.gate / BT.COLS) | 0)); g.rotation.y = lay.wallRotY; bstuff.add(g); }
  lay.towers.forEach((p, i) => { const tw = meshOf(towerModel(sfac)); tw.position.copy(p); tw.scale.setScalar(lay.towerScale); tw.rotation.y = lay.wallRotY; bstuff.add(tw); if (i === 0) bctx.tower = tw; });
  if (lay.keep) { const kp = meshOf(keepModel(sfac)); kp.position.copy(lay.keep); kp.scale.setScalar(lay.keepScale); bstuff.add(kp); }
}
// ---- units + badges
const um = (id) => havenModel(id) || necroModel(id) || unitModel(id, UNITS[id].col);
const cam = new THREE.PerspectiveCamera(52, W / H, 0.1, 100);
const s = Math.sin(yaw), c = Math.cos(yaw);
cam.position.set(s * dist * 0.82, dist * 0.86, c * dist * 0.82 + 0.4); cam.lookAt(0, 0, -0.15); cam.updateMatrixWorld();
const fwd = new THREE.Vector3().subVectors(cam.position, new THREE.Vector3()).setY(0).normalize();
for (const st of B.stacks) {
  const m = meshOf(um(st.id)); m.scale.setScalar(1.25); m.position.copy(hexPos(st.c, st.r)); m.rotation.y = st.side === 0 ? Math.PI : 0; scene.add(m);
  const v = m.position.clone().setY(0.02).addScaledVector(fwd, 0.34).project(cam);
  const d = document.createElement('div'); d.className = 'lab s' + st.side; d.textContent = st.count; d.style.transform = `translate(${(v.x * 0.5 + 0.5) * W}px, ${(-v.y * 0.5 + 0.5) * H}px)`; document.body.appendChild(d);
}
renderer.render(scene, cam);
const scr = (p) => { const v = p.clone().project(cam); return [Math.round((v.x * 0.5 + 0.5) * W), Math.round((-v.y * 0.5 + 0.5) * H)]; };
window.__done = { towers: lay?.towers.map((p) => [scr(p), scr(p.clone().setY(3.2 * lay.towerScale))]), keep: lay?.keep && [scr(lay.keep), scr(lay.keep.clone().setY(5.2))], corners: [scr(hexPos(0, 0)), scr(hexPos(COLS - 1, 0)), scr(hexPos(0, ROWS - 1)), scr(hexPos(COLS - 1, ROWS - 1))] };
</script></body></html>
