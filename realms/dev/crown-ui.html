<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Crown Run UI · dev</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Nunito:wght@600;800;900&display=swap" />
<link rel="stylesheet" href="../style.css" />
<style>body { background: #2a4a2a; } #hud { position: fixed; inset: 0; } .note { position: fixed; right: 8px; bottom: 6px; z-index: 50; color: #fff; font: 700 11px Nunito; opacity: .6; }</style>
</head>
<body>
<!-- Crown Run screens against mock state (agent "crown"). ?s=doll|set|pandora|chest|witch|merchant|black|trade|key|seer|guardian|invasion|end|coll|origin -->
<div id="hud"><header class="resbar"><span class="rc rc-gold"><i data-ic="gold" data-size="24"></i><b>12,500</b></span><span class="rc"><i data-ic="wood" data-size="24"></i><b>20</b></span><span class="rc"><i data-ic="ore" data-size="24"></i><b>20</b></span><span class="rc"><i data-ic="gems" data-size="24"></i><b>5</b></span><em id="r-day"><small>Week 2</small><b>Day 4</b></em></header></div>
<p class="note" id="note"></p>
<script type="module">
import { icon, hydrateIcons, ensureDefs } from '../icons.js';
import * as C from '../crown.js?v=1.10';
import { createCrownUI } from '../crown_ui.js?v=1.10';
import { UNITS } from '../data.js?v=1.10';
ensureDefs(); hydrateIcons(document);
// stand-in portraits (the game passes real 3D portraits)
const unitIcon = (id, s = 64) => { const u = UNITS[id]; const c = '#' + (u?.col ?? 0x888888).toString(16).padStart(6, '0'); return `<img class="pt" alt="" src="data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><rect width='64' height='64' rx='10' fill='${c}'/><text x='32' y='42' font-size='26' font-family='Georgia' font-weight='bold' text-anchor='middle' fill='#fff' stroke='#000' stroke-width='1'>${(u?.name || '?').slice(0, 2)}</text></svg>`)}" width="${s}" height="${s}">`; };
const UI = createCrownUI({ icon, unitIcon, sfx: {} });
const meta = C.metaDefault(); meta.glory = 74; meta.collection.seen = { war_drum: 1, sharpshooter_bow: 1, bone_cloak: 1, clover: 1 }; meta.collection.artifacts = { war_drum: 2 }; meta.collection.guardians = { wall: 1 }; meta.collection.units = { pikeman: 1, archer: 1, griffin: 1, goblin: 1, orc: 1 }; meta.trophies = ['first_blood'];
const run = C.newRun({ seed: 42, meta });
for (const id of ['war_drum', 'vanguard_standard', 'executioner_axe', 'helm_command', 'griffin_cape', 'talon_ring', 'pike_pauldron', 'clover', 'judgement', 'sharpshooter_bow']) C.addArtifact(run, id);
run.region = 2; run.keys = [1]; run.stats.guardians = ['wall'];
const s = new URLSearchParams(location.search).get('s') || 'doll';
document.getElementById('note').textContent = `crown-ui dev · ${s} · ${innerWidth}x${innerHeight}`;
const army = [['pikeman', 40], ['archer', 18], ['griffin', 9], ['swordsman', 4]];
const inv = C.invasionArmy(run, 2);
UI.mountHud(document.getElementById('hud')); UI.renderHud(run, { invasion: { dir: 'east', days: 2, week: 2 } });
const ctx = { known: ['bless'], skills: { leadership: 1 } };
if (s === 'doll') UI.paperDoll(run, { heroName: 'Sir Aldric', heroPic: unitIcon('cavalier', 104), heroStats: { att: 3, def: 2, pow: 1, know: 1 } });
if (s === 'pandora') UI.choice({ title: "Pandora's Box", icon: 'chest', choices: C.pandoraChoices(run, 77, meta, ctx), onPick: () => true });
if (s === 'chest') UI.choice({ title: 'Treasure Chest', icon: 'chest', choices: C.chestChoices(run, 5, meta), onPick: () => true, leave: null });
if (s === 'witch') UI.choice({ title: 'Witch Hut', icon: 'sorcery', choices: C.witchChoices(run, 3, ctx), onPick: () => true });
if (s === 'merchant') { const g = { n: 12500 }; UI.merchant(run, { title: 'Artifact Merchant', stock: C.merchantStock(run, 9, 3, meta), gold: () => g.n, onBuy: (it) => { g.n -= it.price; return true; }, sellList: () => run.backpack.map((inst) => ({ inst, price: C.sellPrice(inst.id) })), onSell: () => true }); }
if (s === 'black') UI.merchant(run, { title: 'Black Market', black: true, stock: C.merchantStock(run, 9, 3, meta, true), gold: () => 9000, onBuy: () => true, sellList: () => [], onSell: () => false });
if (s === 'trade') { const r = { gold: 6000, wood: 12, ore: 9, gems: 3 }; UI.tradingPost({ res: () => r, trade: () => true }); }
if (s === 'key') UI.notice({ icon: 'lock', title: 'The Red Key', sub: "Keymaster's Tent of region 1", body: '<p>The keymaster bows: <b>Gorrak the Wall</b> has fallen. The Red Border Guard will now let you pass into region 2.</p>', sound: 'fanfare' });
if (s === 'seer') { const q = C.seerQuest(run, 4, meta); UI.notice({ icon: 'scouting', title: "Seer's Hut", sub: 'A quest', body: '<p>"Bring me <b>15 ore</b> and <b>2,000 gold</b>, and this is yours."</p>', card: { kind: 'artifact', id: q.reward }, buttons: [['Hand them over', null, 'gold'], ['Later', null, 'ghost']] }); }
if (s === 'guardian') UI.guardianCard(run, 2, C.guardianArmy(run, 2), { onFight: () => {} });
if (s === 'invasion') UI.invasionCard(run, inv, { days: 2, dir: 'east', onFly: () => {} });
if (s === 'set') { UI.paperDoll(run, { heroName: 'Sir Aldric', heroPic: unitIcon('cavalier', 104), heroStats: { att: 3, def: 2, pow: 1, know: 1 } }); }
if (s === 'end') { run.region = 3; run.won = true; run.over = true; run.stats.guardians = ['wall', 'plague', 'lich_queen']; run.stats.invasions = [1, 2, 3]; run.invasionsBeaten = 3; run.stats.setsDone = ['warlord']; run.stats.bestHit = 1240; run.stats.stacksKilled = 31; const res = C.endRun(run, meta, { armyPower: 31000, gold: 14000 }); UI.endScreen(run, res, meta, { onNew() {}, onCollection() {}, onTitle() {} }); }
if (s === 'coll') UI.collection(meta, {});
if (s === 'origin') UI.heroPick(meta, { onStart() {} });
window.__crownUI = { UI, run, meta, C };
</script>
</body>
</html>
