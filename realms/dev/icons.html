<!doctype html><html><head><meta charset="utf-8"><title>Icons</title>
<link rel="stylesheet" href="../style.css">
<style>html,body{overflow:auto;touch-action:auto;background:#3a2a1e} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;padding:10px}
.c{background:linear-gradient(#f6e6bf,#e5c98e);color:#3a2414;border-radius:8px;padding:6px;text-align:center;font:700 10px sans-serif}
.c div{display:flex;gap:4px;justify-content:center;align-items:end}.c.dk{background:#2a3566;color:#fff}</style></head>
<body><div class="grid" id="g"></div>
<script type="module">
import { icon, ICON_NAMES, hasIcon } from '../icons.js';
const names = new URL(location).searchParams.get('alias') ? ICON_NAMES : ICON_NAMES.filter(n => !['defend'].includes(n)).slice(0, ICON_NAMES.indexOf('defend'));
document.getElementById('g').innerHTML = names.map((n,i) => `<div class="c ${i%2?'dk':''}"><div>${icon(n,16)}${icon(n,24)}${icon(n,40)}</div>${n}</div>`).join('');
</script></body></html>
