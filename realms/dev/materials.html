<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Materials preview</title>
<style>html,body{margin:0;height:100%;background:#0a0d1e;color:#cde;font:12px sans-serif;overflow:hidden}#lab{position:fixed;top:6px;left:8px;line-height:1.5}</style>
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.js" } }</script>
</head><body><div id="lab">left of each pair: plain MeshStandardMaterial &middot; right: makeBodyMaterial / makeGlowMaterial<br>bottom row: InstancedMesh trees &amp; rocks, hit flash on last unit</div>
<script type="module">
import * as THREE from 'three';
import { unitModel, townModel, objectModel, treeModel, rockModel, heroModel } from '../models.js';
import { makeBodyMaterial, makeGlowMaterial, makeHitMaterial, setHit, tick } from '../materials.js';

const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a2238);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4); sun.position.set(4, 8, 5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 0.5, far: 30 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
scene.add(sun, new THREE.HemisphereLight(0xbcd4ff, 0x3a3020, 0.8), new THREE.AmbientLight(0x404a70, 0.35));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x4a7a3a, roughness: 1 }));
ground.receiveShadow = true; scene.add(ground);

const plainBody = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.75 });
const plainGlow = new THREE.MeshBasicMaterial({ vertexColors: true, toneMapped: false }); plainGlow.color.setScalar(2.2);
const body = makeBodyMaterial(THREE, { detail: q.has('detail') ? +q.get('detail') : 1 });
const glow = makeGlowMaterial(THREE);
const hit = makeHitMaterial(THREE);

const spinners = [];
function add(m, x, z, s, mat, gmat) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(m.body, mat); b.castShadow = b.receiveShadow = true; g.add(b);
  if (m.glow) g.add(new THREE.Mesh(m.glow, gmat));
  g.position.set(x, 0, z); g.scale.setScalar(s); scene.add(g); spinners.push(g); return g;
}
const rows = [
  [unitModel('pikeman', 0x3a7aff), unitModel('griffin'), unitModel('lich'), unitModel('ogre')],
  [townModel('haven'), townModel('necro'), heroModel(0xd83a3a)],
  [objectModel('goldmine'), objectModel('shrine'), objectModel('sawmill'), objectModel('chest')],
];
rows.forEach((row, r) => row.forEach((m, i) => {
  const n = row.length, x = (i - (n - 1) / 2) * 3.4, z = (r - 1) * 2.6 - 0.8, s = r === 1 ? 1.0 : r === 2 ? 1.2 : 0.95;
  add(m, x - 0.8, z, s, plainBody, plainGlow);
  add(m, x + 0.8, z, s, body, glow);
}));
// instanced flora on both materials
const tree = treeModel(0), rock = rockModel(0), dummy = new THREE.Object3D();
for (const [mat, x0] of [[plainBody, -6.2], [body, -1.6]]) {
  for (const [model, n, sc] of [[tree, 5, 0.9], [rock, 3, 0.5]]) {
    const im = new THREE.InstancedMesh(model.body, mat, n); im.castShadow = im.receiveShadow = true;
    for (let i = 0; i < n; i++) { dummy.position.set(x0 + i * 0.85 + (model === rock ? 0.4 : 0), 0, 3.0 + (model === rock ? 0.8 : 0)); dummy.rotation.y = i * 1.3; dummy.scale.setScalar(sc); dummy.updateMatrix(); im.setMatrixAt(i, dummy.matrix); }
    scene.add(im);
  }
}
const victim = add(unitModel('swordsman', 0x3a7aff), 4.6, 3.3, 0.95, hit, glow);

const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
const resize = () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  const f = q.get('focus'); // focus=0..3 frames one row up close
  if (f !== null) { const z = (+f - 1) * 2.6 - 0.8 + (+f === 3 ? 0.4 : 0); camera.position.set(+(q.get('x') || 0), 2.2, z + 5.2); camera.lookAt(+(q.get('x') || 0), 0.55, z); return; }
  const far = camera.aspect < 0.8 ? 30 : 19; camera.position.set(0, far * 0.55, far * 0.8); camera.lookAt(0, 0.2, 0.8); };
addEventListener('resize', resize); resize();
const t0 = performance.now(), spin = !q.has('still');
function frame() {
  const t = (performance.now() - t0) / 1000;
  tick(t);
  if (spin) spinners.forEach((g, i) => (g.rotation.y = t * 0.4 + (i >> 1) * 0.5)); else spinners.forEach((g, i) => (g.rotation.y = 0.5 + (i >> 1) * 0.0));
  setHit(hit, 0.5 + 0.5 * Math.sin(t * 6));
  renderer.render(scene, camera); requestAnimationFrame(frame);
}
frame();
</script></body></html>
