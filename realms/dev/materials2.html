<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Materials round 2</title>
<style>html,body{margin:0;height:100%;background:#0a0d1e;color:#fff;font:13px sans-serif;overflow:hidden}#lab{position:fixed;top:6px;left:8px;right:8px;display:flex;justify-content:space-between;text-shadow:0 1px 2px #000}</style>
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.js" } }</script>
</head><body><div id="lab"><span>left: round-1 material</span><span id="lr">right: round-2 material</span></div>
<script type="module">
// split-screen: same scene, left half drawn with the round-1 body material, right half with the new one
// ?light=prop applies the proposed main.js lighting; ?row=units|necro|world
import * as THREE from 'three';
import { havenModel } from '../units_haven.js';
import { necroModel } from '../units_necro.js';
import { neutralModel } from '../units_neutral.js';
import { townModel, heroModel } from '../models_towns.js';
import { objectModel } from '../models_objects.js';
import { treeModel, rockModel } from '../nature.js';
import * as NEW from '../materials.js';
const OLD = await import('./shots/mat2-orig-materials.js');
const q = new URLSearchParams(location.search), prop = q.get('light') === 'prop', row = q.get('row') || 'necro';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = prop ? 1.12 : 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = prop ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
renderer.setScissorTest(true);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8fc4ee);
const sun = new THREE.DirectionalLight(prop ? 0xffe8c4 : 0xfff0d8, prop ? 2.6 : 2.4); sun.position.set(4, 8, 5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 0.5, far: 30 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
if (prop) { sun.shadow.intensity = 0.62; sun.shadow.radius = 3; }
scene.add(sun, new THREE.HemisphereLight(prop ? 0xcfe2ff : 0xbcd4ff, prop ? 0x8a7048 : 0x3a3020, prop ? 1.2 : 0.8), new THREE.AmbientLight(prop ? 0x8088c0 : 0x404a70, prop ? 0.45 : 0.35));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x5a9a3a, roughness: 1 }));
ground.receiveShadow = true; scene.add(ground);
const mats = { old: OLD.makeBodyMaterial(THREE), neu: NEW.makeBodyMaterial(THREE) };
const glow = NEW.makeGlowMaterial(THREE);
const bodies = [];
const ROWS = {
  necro: [['skeleton', necroModel], ['zombie', necroModel], ['wight', necroModel], ['vampire', necroModel], ['lich', necroModel], ['blackknight', necroModel], ['bonedragon', necroModel]],
  units: [['pikeman', havenModel], ['griffin', havenModel], ['monk', havenModel], ['cavalier', havenModel], ['angel', havenModel], ['troll', neutralModel], ['ogre', neutralModel]],
  world: [['necro', townModel], ['haven', townModel], ['goldmine', objectModel], ['sawmill', objectModel], ['pine', treeModel], ['oak', treeModel], [0, rockModel]],
};
const list = ROWS[row];
list.forEach(([id, fn], i) => {
  const m = fn(id); if (!m) return;
  const g = new THREE.Group();
  const b = new THREE.Mesh(m.body, mats.old); b.castShadow = b.receiveShadow = true; g.add(b); bodies.push(b);
  if (m.glow) g.add(new THREE.Mesh(m.glow, glow));
  const s = row === 'world' ? 1.6 : 1.25;
  g.position.set((i % 4 - 1.5) * 1.9 + (i >= 4 ? 0.95 : 0), 0, i >= 4 ? 1.5 : -0.6); g.scale.setScalar(s); g.rotation.y = 0.45;
  scene.add(g);
});
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / 2 / innerHeight; camera.updateProjectionMatrix(); camera.position.set(0, 3.6, 8.8); camera.lookAt(0, 0.7, 0.4); }
addEventListener('resize', resize); resize();
function frame(t) {
  NEW.tick(t / 1000); OLD.tick(t / 1000);
  const w = innerWidth / 2, h = innerHeight;
  for (const [k, x] of [['old', 0], ['neu', w]]) {
    bodies.forEach((b) => (b.material = mats[k]));
    renderer.setViewport(x, 0, w, h); renderer.setScissor(x, 0, w, h); renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
