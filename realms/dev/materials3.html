<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Materials round 3</title>
<style>html,body{margin:0;height:100%;background:#0a0d1e;color:#fff;font:13px sans-serif;overflow:hidden}#lab{position:fixed;top:6px;left:8px;right:8px;display:flex;justify-content:space-between;text-shadow:0 1px 2px #000}</style>
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.js" } }</script>
</head><body><div id="lab"><span id="ll"></span><span>right: round-3 (ink + sat + blob shadow)</span></div>
<script type="module">
// split screen. ?l=old (round-2 material, no blob) | noink (round-3 with ink:0, with blob). ?ink=0.5 &zoom=1
import * as THREE from 'three';
import { townModel, heroModel } from '../models_towns.js';
import { objectModel } from '../models_objects.js';
import { natureModel } from '../nature.js';
import * as NEW from '../materials.js';
const OLD = await import('./shots/r3mat-orig-materials.js');
const q = new URLSearchParams(location.search), lmode = q.get('l') || 'old';
document.getElementById('ll').textContent = lmode === 'old' ? 'left: round-2 material' : 'left: round-3, ink 0';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.setScissorTest(true);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8fc4ee);
const sun = new THREE.DirectionalLight(0xffe8c4, 2.5); sun.position.set(4, 8, 5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 0.5, far: 30 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02; sun.shadow.intensity = 0.62; sun.shadow.radius = 3;
scene.add(sun, new THREE.HemisphereLight(0xcfe2ff, 0x7a6440, 1.05), new THREE.AmbientLight(0x7880b8, 0.4));
const gcol = { grass: 0x7d9a5c, sand: 0xcdb487, dirt: 0x9a8064, snow: 0xdde4ee }[q.get('g') || 'grass'];
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: gcol, roughness: 1 }));
ground.receiveShadow = true; scene.add(ground);
const ink = +(q.get('ink') ?? 0.5);
const mats = { old: OLD.makeBodyMaterial(THREE), noink: NEW.makeBodyMaterial(THREE, { ink: 0 }), neu: NEW.makeBodyMaterial(THREE, { ink, inkWidth: +(q.get('w') || 0.3), inkProxy: +(q.get('px') || 0.45) }) };
const glow = NEW.makeGlowMaterial(THREE);
const hullMat = NEW.makeInkHullMaterial(THREE, { width: +(q.get('hw') || 0.0022) }), hulls = [];
const blobMat = NEW.makeBlobShadowMaterial(THREE), blobGeo = NEW.blobShadowGeometry(THREE);
const bodies = [], blobs = [];
const list = [
  [() => townModel('haven'), 1.5, 0.75], [() => objectModel('goldmine'), 1.2, 0.6], [() => objectModel('sawmill'), 1.2, 0.6], [() => natureModel('peak:rock:0'), 1.2, 0.6],
  [() => objectModel('chest'), 1.4, 0.4], [() => objectModel('gold'), 1.4, 0.4], [() => heroModel('haven', 0xd03030), 1.4, 0.35], [() => objectModel('campfire'), 1.4, 0.4],
  [() => natureModel('oak'), 1.3, 0.35], [() => townModel('necro'), 1.5, 0.75], [() => objectModel('gems'), 1.4, 0.4], [() => objectModel('shrine'), 1.2, 0.5],
];
list.forEach(([fn, s, br], i) => {
  const m = fn(); if (!m) return;
  const g = new THREE.Group();
  const b = new THREE.Mesh(m.body, mats.old); b.castShadow = b.receiveShadow = true; g.add(b); bodies.push(b);
  if (q.get('hull') !== '0') { const hm = new THREE.Mesh(m.body, hullMat); g.add(hm); hulls.push(hm); }
  if (m.glow) g.add(new THREE.Mesh(m.glow, glow));
  const bl = new THREE.Mesh(blobGeo, blobMat); bl.scale.setScalar(br * 1.15); g.add(bl); blobs.push(bl);
  const r = Math.floor(i / 4), c = i % 4;
  g.position.set((c - 1.5) * 1.75 + (r % 2) * 0.4, 0, (r - 1) * 1.8); g.scale.setScalar(s); g.rotation.y = 0.35 + i * 0.4;
  scene.add(g);
});
const camera = new THREE.PerspectiveCamera(34 / (+q.get('zoom') || 1), 1, 0.1, 100);
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / 2 / innerHeight; camera.updateProjectionMatrix(); const D = +(q.get("d") || 13); camera.position.set(0, D * 0.8, D * 0.75); camera.lookAt(+(q.get('x') || 0), 0.3, 0.2); }
addEventListener('resize', resize); resize();
function frame(t) {
  NEW.tick(t / 1000); OLD.tick(t / 1000);
  const w = innerWidth / 2, h = innerHeight;
  for (const [k, x] of [[lmode, 0], ['neu', w]]) {
    bodies.forEach((b) => (b.material = mats[k])); blobs.forEach((b) => (b.visible = k !== 'old')); hulls.forEach((b) => (b.visible = k === 'neu'));
    renderer.setViewport(x, 0, w, h); renderer.setScissor(x, 0, w, h); renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
