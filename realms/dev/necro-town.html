<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Necropolis Town Buildings</title>
<style>html,body{margin:0;background:#8ea4c0;color:#fff;font:11px sans-serif;overflow:hidden}#info{position:fixed;left:4px;top:2px;white-space:pre;pointer-events:none;z-index:2;text-shadow:0 1px 2px #000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three.module.js"}}</script>
</head><body><div id="info"></div>
<script type="module">
// ?mode=grid (default) | town ; ?ids=d1,u1 ; ?a=angle ; ?built=all|base
import * as THREE from 'three';
import { necroTownBuilding, NECRO_TOWN_IDS } from '../necro_town.js';
import { makeBodyMaterial, makeGlowMaterial, tick } from '../materials.js';
const Q = new URLSearchParams(location.search);
const mode = Q.get('mode') || 'grid';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const bodyMat = makeBodyMaterial(THREE), glowMat = makeGlowMaterial(THREE);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ab4d0);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4); sun.position.set(6, 10, 8); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 60 }); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
scene.add(sun, new THREE.HemisphereLight(0xcfe6ff, 0x6a5a4a, 0.9), new THREE.AmbientLight(0x6a6a90, 0.35));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x8a9a62, roughness: 1 }));
ground.receiveShadow = true; scene.add(ground);
function mk(id) {
  const m = necroTownBuilding(id), g = new THREE.Group();
  const b = new THREE.Mesh(m.body, bodyMat); b.castShadow = b.receiveShadow = true; g.add(b);
  if (m.glow) g.add(new THREE.Mesh(m.glow, glowMat));
  g.userData.tris = (m.body.attributes.position.count + (m.glow ? m.glow.attributes.position.count : 0)) / 3;
  return g;
}
let txt = '';
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 200);
if (mode === 'grid') {
  const ids = Q.get('ids') ? Q.get('ids').split(',') : NECRO_TOWN_IDS.filter((i) => i !== 'fort');
  const cols = +(Q.get('cols') || Math.ceil(Math.sqrt(ids.length * innerWidth / innerHeight)));
  const sp = +(Q.get('sp') || 3.6), a = Q.has('a') ? +Q.get('a') : 0.35;
  ids.forEach((id, i) => {
    const g = mk(id), c = i % cols, r = Math.floor(i / cols);
    g.position.set((c - (cols - 1) / 2) * sp, 0, r * sp * 1.1); g.rotation.y = a; scene.add(g);
    const bb = new THREE.Box3().setFromObject(g), sz = bb.getSize(new THREE.Vector3());
    txt += `${id}: ${g.userData.tris} tris  ${sz.x.toFixed(2)}x${sz.z.toFixed(2)} h${sz.y.toFixed(2)}\n`;
  });
  const rows = Math.ceil(ids.length / cols), W = cols * sp, D = rows * sp * 1.1;
  const t = Math.tan(15 * Math.PI / 180), d = Math.max(W * 0.5 / (t * cam.aspect), D * 0.5 / t * 0.8) + 3;
  cam.position.set(0, d * 0.45, D / 2 - sp * 0.4 + d * 0.89); cam.lookAt(0, 1.0, D / 2 - sp * 0.4);
} else {
  // mock HoMM3 town panorama: fort behind, halls central, dwellings around
  const L = Q.get('built') === 'base'
    ? { village: [0, 0], fort: [0, -5.2], tavern: [3.1, 1.8], mage1: [-3.6, -1.6], d1: [-5.5, 2.2], d2: [-2.8, 2.6], d3: [5.6, 2.4], d4: [3.4, -1.8], d5: [6.2, -1.5], d6: [-6.4, -1.8], d7: [0.2, -3.0], market: [-0.2, 3.6] }
    : { hall3: [0, 0], fort: [0, -5.2], tavern: [3.1, 1.8], mage3: [-3.6, -1.6], u1: [-5.5, 2.2], u2: [-2.8, 2.6], u3: [5.6, 2.4], u4: [3.4, -1.8], u5: [6.2, -1.5], u6: [-6.4, -1.8], u7: [0.2, -3.0], market: [-0.2, 3.6] };
  let tot = 0;
  for (const [id, [x, z]] of Object.entries(L)) { const g = mk(id); g.position.set(x, 0, z); g.rotation.y = -x * 0.04; scene.add(g); tot += g.userData.tris; }
  txt = 'total tris ' + tot;
  cam.fov = 40; cam.updateProjectionMatrix();
  cam.position.set(0, 7.5, 13.5); cam.lookAt(0, 0.6, -0.5);
}
document.getElementById('info').textContent = txt; window.__info = txt;
renderer.render(scene, cam);
window.DONE = true;
</script></body></html>
