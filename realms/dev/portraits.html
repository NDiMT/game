<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portraits</title>
<style>html,body{margin:0;background:#241c30;color:#f0e0c0;font:11px sans-serif}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:8px}
.c{text-align:center}.c img{display:block;margin:0 auto 2px;border-radius:8px;border:1px solid #c8a050}
.row{display:flex;gap:6px;align-items:end;padding:8px;flex-wrap:wrap}.row img{border-radius:6px;border:1px solid #c8a050}
h3{margin:6px 8px 0;font-size:12px}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three.module.js"}}</script></head>
<body><div id="out"></div><script type="module">
import * as THREE from 'three';
import { UNITS, FACTIONS, UPGRADES, NEUTRALS } from '../data.js?v=0.3';
import { unitModel } from '../models.js?v=0.3';
import { havenModel } from '../units_haven.js?v=0.3';
import { necroModel } from '../units_necro.js?v=0.3';
import { neutralModel } from '../units_neutral.js?v=0.3';
const { initPortraits, portraitImg } = await import('../portraits.js?v=' + Date.now());
const q = new URLSearchParams(location.search), S = +(q.get('s') ?? 64);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(16, 16);
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; r.shadowMap.enabled = true;
const unitGeo = (id) => { const base = UNITS[id]?.up || id; return havenModel(base) || necroModel(base) || neutralModel(base) || unitModel(base, UNITS[id].col); };
initPortraits(THREE, r, unitGeo);
const t0 = performance.now();
const sec = (title, ids, s = S) => `<h3>${title}</h3><div class="grid">${ids.map((id) => `<div class="c">${portraitImg(id, s)}${UNITS[id]?.name || id}</div>`).join('')}</div>`;
let h = sec('Haven', FACTIONS.haven.units) + sec('Haven upgraded', UPGRADES.haven) + sec('Necropolis', FACTIONS.necro.units) + sec('Necropolis upgraded', UPGRADES.necro) + sec('Neutral', NEUTRALS) + sec('Heroes', ['hero:haven', 'hero:necro', 'hero:haven:2ab84a', 'hero:necro:d8a03a']);
h += `<h3>Queue size (34 px)</h3><div class="row">${[...FACTIONS.haven.units, ...FACTIONS.necro.units].map((id) => portraitImg(id, 34)).join('')}</div>`;
const ms = performance.now() - t0;
document.getElementById('out').innerHTML = `<h3>${Object.keys(UNITS).length} units + heroes rendered in ${ms.toFixed(0)} ms</h3>` + h;
window.ready = true;
</script></body></html>
