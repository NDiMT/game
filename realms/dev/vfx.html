<!doctype html>
<html><head><meta charset="utf-8"><title>Battle VFX preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#1a1d24;color:#eee;font:13px sans-serif;overflow:hidden}canvas{display:block}#l{position:fixed;top:6px;left:8px;text-shadow:0 1px 2px #000;font-weight:bold;font-size:16px}#sheet{display:none}</style>
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.js" } }</script>
</head><body><div id="l"></div><canvas id="sheet"></canvas>
<script type="module">
// Loops every battle effect on a real battlefield.
//   ?            loop all effects (game camera)
//   ?sheet=1     contact sheet: each effect frozen at a good moment, zoomed (for screenshots)
//   ?fx=bolt     loop one effect
import * as THREE from 'three';
import { createVfx, shotKind } from '../vfx.js';
import { createBattlefield } from '../battlefield.js';
import { gradeGLSL } from '../atmosphere.js';
import { unitModel } from '../models.js';
import { havenModel } from '../units_haven.js';
import { necroModel } from '../units_necro.js';
import { neutralModel } from '../units_neutral.js';
import { makeBodyMaterial, makeGlowMaterial } from '../materials.js';
import { COLS, ROWS } from '../battle.js';
import { UNITS } from '../data.js';

const Q = new URLSearchParams(location.search);
const SHEET = Q.has('sheet');
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: SHEET });
renderer.setPixelRatio(SHEET ? 1 : Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// the game's bloom pipeline (copied from main.js)
const post = (() => {
  const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)), quadScene = new THREE.Scene(); quadScene.add(quad);
  const opts = { type: THREE.HalfFloatType, depthBuffer: false };
  const rtScene = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }), rtA = new THREE.WebGLRenderTarget(1, 1, opts), rtB = new THREE.WebGLRenderTarget(1, 1, opts);
  const vs = 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
  const bright = new THREE.ShaderMaterial({ uniforms: { tMap: { value: null } }, vertexShader: vs, depthTest: false, fragmentShader: 'uniform sampler2D tMap; varying vec2 vUv; void main() { vec3 c = texture2D(tMap, vUv).rgb; float l = max(c.r, max(c.g, c.b)); gl_FragColor = vec4(c * smoothstep(0.9, 1.7, l), 1.0); }' });
  const blur = new THREE.ShaderMaterial({ uniforms: { tMap: { value: null }, uDir: { value: new THREE.Vector2() } }, vertexShader: vs, depthTest: false, fragmentShader: 'uniform sampler2D tMap; uniform vec2 uDir; varying vec2 vUv; void main() { vec3 c = texture2D(tMap, vUv).rgb * 0.227; c += (texture2D(tMap, vUv + uDir * 1.38).rgb + texture2D(tMap, vUv - uDir * 1.38).rgb) * 0.316; c += (texture2D(tMap, vUv + uDir * 3.23).rgb + texture2D(tMap, vUv - uDir * 3.23).rgb) * 0.07; gl_FragColor = vec4(c, 1.0); }' });
  const comp = new THREE.ShaderMaterial({ uniforms: { tScene: { value: null }, tBloom: { value: null } }, vertexShader: vs, depthTest: false, fragmentShader: `uniform sampler2D tScene; uniform sampler2D tBloom; varying vec2 vUv;
    ${gradeGLSL}
    void main() { vec3 c = texture2D(tScene, vUv).rgb + texture2D(tBloom, vUv).rgb * 0.8; c = grade(c); c = c / (1.0 + c * 0.12);
      float v = smoothstep(1.15, 0.35, length(vUv - 0.5)); c *= mix(0.72, 1.0, v); gl_FragColor = vec4(c, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }` });
  let w = 1, hh = 1;
  return {
    setSize(W, H, pr) { w = W * pr; hh = H * pr; rtScene.setSize(w, hh); rtA.setSize(w / 2, hh / 2); rtB.setSize(w / 2, hh / 2); },
    render(sc, cm) {
      renderer.setRenderTarget(rtScene); renderer.render(sc, cm);
      const tm = renderer.toneMapping; renderer.toneMapping = THREE.NoToneMapping;
      quad.material = bright; bright.uniforms.tMap.value = rtScene.texture; renderer.setRenderTarget(rtA); renderer.render(quadScene, quadCam);
      quad.material = blur;
      for (let i = 0; i < 2; i++) { blur.uniforms.tMap.value = rtA.texture; blur.uniforms.uDir.value.set(2 / w, 0); renderer.setRenderTarget(rtB); renderer.render(quadScene, quadCam); blur.uniforms.tMap.value = rtB.texture; blur.uniforms.uDir.value.set(0, 2 / hh); renderer.setRenderTarget(rtA); renderer.render(quadScene, quadCam); }
      renderer.toneMapping = tm;
      quad.material = comp; comp.uniforms.tScene.value = rtScene.texture; comp.uniforms.tBloom.value = rtA.texture;
      renderer.setRenderTarget(null); renderer.render(quadScene, quadCam);
    },
  };
})();

const HS = 0.5, HW = Math.sqrt(3) * HS, VS = 1.5 * HS;
const hexPos = (c, r) => new THREE.Vector3((c - (COLS - 1) / 2 + (r & 1 ? 0.5 : 0) - 0.25) * HW, 0, (r - (ROWS - 1) / 2) * VS);
const scene = new THREE.Scene();
const bf = createBattlefield(THREE, +(Q.get('t') || 1), hexPos, COLS, ROWS);
scene.add(bf.group); scene.background = new THREE.Color(bf.sky); scene.fog = new THREE.Fog(bf.fog.color, bf.fog.near, bf.fog.far);
const L = bf.lights;
const sun = new THREE.DirectionalLight(L.sun.color, L.sun.intensity); sun.position.set(4, 10, 3); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 });
scene.add(sun, new THREE.HemisphereLight(L.hemi.sky, L.hemi.ground, L.hemi.intensity), new THREE.AmbientLight(L.ambient.color, L.ambient.intensity));
renderer.toneMappingExposure = L.exposure;

const bodyMat = makeBodyMaterial(THREE), glowMat = makeGlowMaterial(THREE);
const unitGeo = (id) => { const b = UNITS[id]?.up || id; return havenModel(b) || necroModel(b) || neutralModel(b) || unitModel(b, UNITS[id].col); };
const meshOf = (m) => { const g = new THREE.Group(); const b = new THREE.Mesh(m.body, bodyMat); b.castShadow = true; g.add(b); if (m.glow) g.add(new THREE.Mesh(m.glow, glowMat)); return g; };
const U = {};
const place = (key, id, c, r, side) => { const m = meshOf(unitGeo(id)); m.scale.setScalar(0.9); m.position.copy(hexPos(c, r)); m.rotation.y = side === 0 ? Math.PI : 0; scene.add(m); U[key] = { m, id, c, r }; };
// shooters at the bottom, targets at the top
place('archer', 'archer', 1, 9, 0); place('monk', 'monk', 2, 10, 0); place('lich', 'lich', 3, 9, 0); place('cyclops', 'cyclops', 4, 10, 0); place('orc', 'orc', 5, 9, 0);
place('sword', 'swordsman', 3, 4, 0); place('skel', 'skeleton', 3, 3, 1); place('ogre', 'ogre', 1, 3, 1); place('zombie', 'zombie', 5, 3, 1);
place('t1', 'pikeman', 2, 1, 1); place('t2', 'wight', 3, 1, 1); place('t3', 'goblin', 4, 1, 1); place('t4', 'wolf', 5, 1, 1);

const vfx = createVfx(THREE, scene);
const at = (k, y = 0.5) => U[k].m.position.clone().setY(y);
const reset = () => { for (const u of Object.values(U)) { u.m.visible = true; } };
const FX = [
  ['Archer arrow', () => vfx.projectile(shotKind('archer'), at('archer', 0.6), at('t1'))],
  ['Monk holy light', () => vfx.projectile(shotKind('monk'), at('monk', 0.7), at('t2'))],
  ['Lich death bolt', () => vfx.projectile(shotKind('lich'), at('lich', 0.7), at('t3'))],
  ['Cyclops boulder', () => vfx.projectile(shotKind('cyclops'), at('cyclops', 1.1), at('t4'))],
  ['Tower arrow', () => vfx.projectile('tower', new THREE.Vector3(4.2, 2.2, -4), at('sword'))],
  ['Melee hit', () => vfx.hit(at('skel'), 'melee', { dir: at('skel').sub(at('sword')) })],
  ['Heavy hit + luck', () => vfx.hit(at('ogre'), 'lucky')],
  ['Death dissolve', () => vfx.death(U.zombie.m, { undead: true })],
  ['Magic Arrow', () => vfx.spell('arrow', at('t1', 0), [U.t1.m])],
  ['Bless', () => vfx.spell('bless', at('sword', 0), [U.sword.m])],
  ['Stone Skin', () => vfx.spell('stoneskin', at('monk', 0), [U.monk.m])],
  ['Cure', () => vfx.spell('cure', at('lich', 0), [U.lich.m])],
  ['Haste', () => vfx.spell('haste', at('archer', 0), [U.archer.m])],
  ['Slow', () => vfx.spell('slow', at('t4', 0), [U.t4.m])],
  ['Lightning', () => vfx.spell('bolt', at('t2', 0), [U.t2.m])],
  ['Fireball', () => vfx.spell('fireball', at('skel', 0), [U.skel.m, U.ogre.m])],
  ['Good morale', () => vfx.sparkle(at('orc', 0), 'morale')],
  ['Luck', () => vfx.sparkle(at('cyclops', 0), 'luck')],
];
// for the contact sheet: when to freeze, and where to look
const SNAP = { 'Archer arrow': [0.2, 'archer', 't1'], 'Monk holy light': [0.25, 'monk', 't2'], 'Lich death bolt': [0.25, 'lich', 't3'], 'Cyclops boulder': [0.35, 'cyclops', 't4'],
  'Tower arrow': [0.3, 'sword'], 'Melee hit': [0.07, 'skel'], 'Heavy hit + luck': [0.12, 'ogre'], 'Death dissolve': [0.3, 'zombie'], 'Magic Arrow': [0.36, 't1'], 'Bless': [0.45, 'sword'],
  'Stone Skin': [0.28, 'monk'], 'Cure': [0.45, 'lich'], 'Haste': [0.35, 'archer'], 'Slow': [0.3, 't4'], 'Lightning': [0.14, 't2'], 'Fireball': [0.52, 'skel'], 'Good morale': [0.5, 'orc'], 'Luck': [0.66, 'cyclops'] };

const cam = new THREE.PerspectiveCamera(46, 1, 0.1, 100);
const gameCam = () => { const d = 12.5; cam.position.set(0, d, d * 0.55 + 0.4); cam.lookAt(0, 0, 0.2); };
const label = document.getElementById('l');
const only = Q.get('fx');

if (!SHEET) {
  const resize = () => { renderer.setSize(innerWidth, innerHeight); post.setSize(innerWidth, innerHeight, renderer.getPixelRatio()); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); };
  addEventListener('resize', resize); resize(); gameCam();
  const list = only ? FX.filter(([n]) => n.toLowerCase().includes(only.toLowerCase())) : FX;
  let i = -1, wait = 0, last = performance.now();
  vfx.select(U.sword.m, 0xffd84a);
  const loop = () => {
    const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
    if ((wait -= dt) <= 0) { i = (i + 1) % list.length; reset(); list[i][1](); label.textContent = list[i][0]; wait = 1.7; }
    vfx.update(dt, cam); post.render(scene, cam);
    requestAnimationFrame(loop);
  };
  loop();
  window.__fps = () => vfx.stats();
} else {
  // contact sheet
  const TW = 330, TH = 330, NC = 6, NR = Math.ceil(FX.length / NC);
  renderer.setSize(TW, TH); post.setSize(TW, TH, 1); cam.aspect = 1; cam.updateProjectionMatrix();
  const sheet = document.getElementById('sheet'); sheet.style.display = 'block'; renderer.domElement.style.display = 'none'; label.style.display = 'none';
  sheet.width = TW * NC; sheet.height = TH * NR; const g = sheet.getContext('2d');
  g.font = 'bold 16px sans-serif'; g.fillStyle = '#fff'; g.shadowColor = '#000'; g.shadowBlur = 3;
  FX.forEach(([name, fn], idx) => {
    vfx.clear(); reset();
    const [t, a, b] = SNAP[name];
    const look = b ? at(a, 0).lerp(at(b, 0), 0.5) : at(a, 0), dist = b ? 8.5 : 4.6;
    cam.position.set(look.x, look.y + dist, look.z + dist * 0.62); cam.lookAt(look.x, 0.45, look.z);
    cam.updateMatrixWorld();
    vfx.select(name === 'Melee hit' ? U.sword.m : null, 0xffd84a);
    vfx.update(0.016, cam); fn();
    for (let s = 0; s < t; s += 1 / 60) vfx.update(1 / 60, cam);
    post.render(scene, cam);
    const x = (idx % NC) * TW, y = Math.floor(idx / NC) * TH;
    g.drawImage(renderer.domElement, x, y, TW, TH); g.fillText(name, x + 8, y + 22);
  });
  // one full game view frame with several effects at once
  window.__done = true;
}
</script></body></html>
