<!doctype html><html><head><meta charset="utf-8"><title>towns</title>
<style>body{margin:0;background:#1a2030}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.js" } }</script></head><body>
<script type="module">
import * as THREE from 'three';
import { townModel, heroModel, flagModel } from '../models_towns.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x26324a);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4); sun.position.set(4, 8, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 });
scene.add(sun, new THREE.HemisphereLight(0xbcd4ff, 0x3a3020, 0.8));
const bodyMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.75 });
const glowMat = new THREE.MeshBasicMaterial({ vertexColors: true, toneMapped: false }); glowMat.color.setScalar(2.2);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x5a8a3a })); ground.receiveShadow = true; scene.add(ground);
function meshOf(m) { const g = new THREE.Group(); const b = new THREE.Mesh(m.body, bodyMat); b.castShadow = b.receiveShadow = true; g.add(b); if (m.glow) g.add(new THREE.Mesh(m.glow, glowMat)); return g; }
const items = [
  [townModel('haven'), -1.6, 0, 1], [townModel('necro'), 1.6, 0, 1],
  [heroModel('haven', 0x3a7aff), -1.3, 1.8, 1], [heroModel('necro', 0xd83a3a), 0, 1.8, 1], [heroModel('haven', 0xd83a3a), 1.3, 1.8, 1],
  [flagModel(0x3a7aff), -2.2, 1.8, 1], [flagModel(0xd83a3a), 2.4, 1.8, 1],
];
let tris = [];
const objs = items.map(([m, x, z, s]) => { const g = meshOf(m); g.position.set(x, 0, z); g.scale.setScalar(s); scene.add(g); tris.push(m.body.attributes.position.count / 3 + (m.glow ? m.glow.attributes.position.count / 3 : 0)); return g; });
const zoom = q.get('zoom');
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 100);
const rot = parseFloat(q.get('rot') || '0');
objs.forEach((o) => (o.rotation.y = rot));
if (zoom !== null) {
  const o = objs[+zoom]; const b = new THREE.Box3().setFromObject(o); const c = b.getCenter(new THREE.Vector3()); const sz = b.getSize(new THREE.Vector3()).length();
  scene.children.filter((x) => x.isGroup && x !== o).forEach((x) => (x.visible = false));
  const el = parseFloat(q.get('el') || '0.5');
  camera.position.set(c.x, c.y + sz * 1.1 * el, c.z + sz * 1.3); camera.lookAt(c);
} else { camera.position.set(0, 4.2, 5.8); camera.lookAt(0, 0.3, 0.8); }
renderer.render(scene, camera);
document.title = 'tris ' + tris.map(Math.round).join(',');
window.DONE = true;
</script></body></html>
