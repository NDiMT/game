<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORBIS sound effects</title>
<style>
  :root { --bg: #14121a; --card: #221e2c; --ink: #f1e9d8; --dim: #a99f8e; --gold: #e7c36a; --line: #3a3348; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; color: var(--gold); }
  p { margin: 0 0 12px; color: var(--dim); }
  .ctl { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 14px; }
  .ctl label { display: flex; gap: 6px; align-items: center; color: var(--dim); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 16px 0 6px; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  button { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button small { color: var(--dim); }
  table { border-collapse: collapse; margin-top: 10px; font: 12px ui-monospace, monospace; }
  td, th { padding: 2px 10px 2px 0; text-align: right; }
  td:first-child, th:first-child { text-align: left; }
  .bad { color: #ff7a6b; }
</style>
</head>
<body>
<h1>ORBIS sound effects</h1>
<p id="st">Tap any button (audio starts on first tap).</p>
<div class="ctl">
  <label>pan <input id="pan" type="range" min="-1" max="1" step="0.1" value="0"></label>
  <label>pitch <input id="pitch" type="range" min="0.5" max="2" step="0.05" value="1"></label>
  <label>vol <input id="vol" type="range" min="0" max="1.5" step="0.05" value="1"></label>
  <button id="all">Play all</button>
  <button id="an">Analyze (offline)</button>
</div>
<div id="groups"></div>
<div id="out"></div>
<script type="module">
import { createSfx, SFX_NAMES } from '../sfx.js';

// every name, plus each kind variant worth hearing on its own
const CASES = [
  ['UI', [['click'], ['tab'], ['select'], ['open'], ['close'], ['confirm'], ['deny']]],
  ['Loot', [['coin'], ['wood'], ['ore'], ['gems'], ['pickup', 'gems'], ['chest'], ['artifact'], ['mana']]],
  ['Map', [['step', 'walk'], ['step', 'hoof'], ['step', 'fly'], ['flag'], ['capture'], ['town'], ['day'], ['week'], ['alarm'], ['magic']]],
  ['Town & hero', [['build'], ['recruit'], ['upgrade'], ['hire'], ['levelup'], ['fanfare']]],
  ['Battle', [['battle'], ['hit', 'melee'], ['hit', 'slash'], ['hit', 'blunt'], ['hit', 'arrow'], ['heavy'], ['defend'],
    ['shoot', 'arrow'], ['shoot', 'tower'], ['shoot', 'holy'], ['shoot', 'death'], ['shoot', 'boulder'], ['shoot', 'magic'], ['shoot', 'fireball'],
    ['die'], ['die', 'undead'], ['gate'], ['gate', 'broken'], ['luck'], ['morale']]],
  ['Spells', ['arrow', 'bolt', 'fireball', 'bless', 'cure', 'haste', 'slow', 'stoneskin'].flatMap((k) => [['cast', k], ['spell', k]])],
  ['Endings', [['victory'], ['defeat']]],
];
window.CASES = CASES; window.SFX_NAMES = SFX_NAMES;

let ac, sfx;
function boot() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  sfx = createSfx(ac, ac.destination);
  sfx.ready.then((n) => { document.getElementById('st').textContent = `${n} sampled instruments ready · ${SFX_NAMES.length} sound names`; });
}
const opts = (kind) => ({ kind, pan: +pan.value, pitch: +pitch.value, vol: +vol.value });
const play = (n, k) => { boot(); if (ac.state === 'suspended') ac.resume(); sfx.play(n, opts(k)); };

const G = document.getElementById('groups');
for (const [title, list] of CASES) {
  const h = document.createElement('h2'); h.textContent = title; G.append(h);
  const g = document.createElement('div'); g.className = 'grid'; G.append(g);
  for (const [n, k] of list) {
    const b = document.createElement('button'); b.innerHTML = k ? `${n} <small>${k}</small>` : n;
    b.onclick = () => play(n, k); g.append(b);
  }
}
document.getElementById('all').onclick = async () => {
  for (const [, list] of CASES) for (const [n, k] of list) { play(n, k); await new Promise((r) => setTimeout(r, n === 'victory' || n === 'defeat' || n === 'week' ? 3000 : 1600)); }
};

// offline render of one case → { peak, rms (max 100 ms window), dur, startAbs, endAbs } in dBFS / seconds
window.renderSfx = async (name, kind, seconds = 4.5, cfg) => {
  const SR = 44100, oc = new OfflineAudioContext(2, SR * seconds, SR);
  const fx = createSfx(oc, oc.destination, cfg);
  await fx.ready;
  fx.play(name, { kind });
  const buf = await oc.startRendering(), L = buf.getChannelData(0), Rr = buf.getChannelData(1), N = L.length;
  let peak = 0, last = 0, hp = 0, px = 0;
  const sq = new Float64Array(N);
  for (let i = 0; i < N; i++) {
    const a = Math.max(Math.abs(L[i]), Math.abs(Rr[i])); if (a > peak) peak = a; if (a > 0.001) last = i;
    const m = (L[i] + Rr[i]) / 2; hp = 0.985 * (hp + m - px); px = m; // ~100 Hz high-pass: a crude loudness weighting
    sq[i] = hp * hp;
  }
  const W = Math.floor(SR * 0.1); let acc = 0, best = 0;
  for (let i = 0; i < N; i++) { acc += sq[i]; if (i >= W) acc -= sq[i - W]; if (acc > best) best = acc; }
  const db = (x) => 20 * Math.log10(Math.max(x, 1e-9));
  return { name, kind: kind || '', peak: db(peak), rms: db(Math.sqrt(best / W)), dur: last / SR, endAbs: Math.max(Math.abs(L[N - 1]), Math.abs(Rr[N - 1])) };
};
document.getElementById('an').onclick = async () => {
  const out = document.getElementById('out'); out.innerHTML = 'rendering…';
  const rows = [];
  for (const [, list] of CASES) for (const [n, k] of list) rows.push(await window.renderSfx(n, k));
  out.innerHTML = `<table><tr><th>sound</th><th>peak dB</th><th>loud dB</th><th>sec</th></tr>${rows.map((r) => `<tr><td>${r.name} ${r.kind}</td><td class="${r.peak > -5 || r.peak < -40 ? 'bad' : ''}">${r.peak.toFixed(1)}</td><td>${r.rms.toFixed(1)}</td><td>${r.dur.toFixed(2)}</td></tr>`).join('')}</table>`;
};
</script>
</body>
</html>
