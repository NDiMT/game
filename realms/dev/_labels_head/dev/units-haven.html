<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haven units</title>
<style>html,body{margin:0;background:#3a4a3a;overflow:hidden}canvas{display:block}#info{position:fixed;left:8px;top:6px;color:#fff;font:12px sans-serif}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three.module.js"}}</script></head>
<body><div id="info"></div><script type="module">
import * as THREE from 'three';
const { havenModel, HAVEN_IDS } = await import('../units_haven.js?v=' + Date.now());
const q = new URLSearchParams(location.search);
const only = q.get('id'), angle = +(q.get('a') ?? 0.6), elev = +(q.get('e') ?? 0.55), spin = q.get('spin') !== '0';
const ids = only ? only.split(',') : HAVEN_IDS;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(Math.min(2, devicePixelRatio)); r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05; r.outputColorSpace = THREE.SRGBColorSpace; r.shadowMap.enabled = true;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x6a8a5a);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4); sun.position.set(4, 10, 3); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
scene.add(sun, new THREE.HemisphereLight(0xcfe0ff, 0x4a3a2a, 0.9), new THREE.AmbientLight(0x404a70, 0.3));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x5a7a3a, roughness: 1 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const bodyMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.75 });
const glowMat = new THREE.MeshBasicMaterial({ vertexColors: true, toneMapped: false }); glowMat.color.setScalar(2.2);
const cols = +(q.get('cols') ?? (only ? Math.min(ids.length, 4) : 4)), rows = Math.ceil(ids.length / cols);
const items = []; let tris = [];
ids.forEach((id, i) => {
  const m = havenModel(id), g = new THREE.Group();
  const b = new THREE.Mesh(m.body, bodyMat); b.castShadow = b.receiveShadow = true; g.add(b);
  if (m.glow) g.add(new THREE.Mesh(m.glow, glowMat));
  const c = i % cols, rr = (i / cols) | 0;
  g.position.set((c - (cols - 1) / 2) * 1.9, 0, (rr - (rows - 1) / 2) * 2.1);
  scene.add(g); items.push(g);
  tris.push(id + ':' + ((m.body.attributes.position.count + (m.glow ? m.glow.attributes.position.count : 0)) / 3));
});
document.getElementById('info').textContent = tris.join('  ');
const cam = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 100);
const dist = +(q.get('d') ?? (only && ids.length === 1 ? 3.6 : 4.2 * Math.max(cols, rows * 1.3)));
cam.position.set(0, Math.sin(elev) * dist, Math.cos(elev) * dist); cam.lookAt(0, only && ids.length === 1 ? 0.6 : 0.3, 0);
let t = 0;
function frame() { t += 0.01; items.forEach((g) => g.rotation.y = spin ? t + angle : angle); r.render(scene, cam); requestAnimationFrame(frame); }
frame(); window.ready = true;
</script></body></html>
