name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - claude/solo-game-ideas-balatro-yj6hqw
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # Το `enablement: true` δοκιμάστηκε και ΔΕΝ δουλεύει εδώ: η δημιουργία
      # του Pages site απαιτεί δικαιώματα admin στο repository, που το
      # GITHUB_TOKEN ενός workflow δεν έχει — απαντά "Resource not accessible
      # by integration". Το Pages πρέπει να ενεργοποιηθεί μία φορά από
      # Settings -> Pages -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5
      # Σφραγίδα build στο service worker: κάθε deploy = νέα cache, νέος worker.
      - name: Stamp service worker with commit SHA
        run: sed -i "s/__BUILD__/${GITHUB_SHA::12}/" site/raise/sw.js && grep -n 'const V' site/raise/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
