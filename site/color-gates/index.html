<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Color Gates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    { "imports": { "three": "../vendor/three.module.js", "three/addons/": "../vendor/" } }
  </script>
</head>
<body>
  <header class="hud">
    <div class="row">
      <div id="level" class="pill">Επίπεδο 1</div>
      <div id="left" class="pill"></div>
    </div>
    <div class="gates">
      <div id="gate" class="gate"></div>
      <div class="queue-wrap">
        <div id="gate-count" class="label"></div>
        <div id="queue" class="queue"></div>
      </div>
    </div>
  </header>

  <footer class="bottom">
    <div class="tray-wrap">
      <div class="label">Ουρά αναμονής</div>
      <div id="tray" class="tray"></div>
    </div>
    <div class="bar">
      <button id="restart" class="btn" title="Επανεκκίνηση (R)" aria-label="Επανεκκίνηση">↻</button>
      <button id="hint" class="btn wide" title="Βοήθεια (H)">💡 <span id="hint-count">3</span></button>
      <button id="sound" class="btn" title="Ήχος" aria-label="Ήχος">🔊</button>
    </div>
  </footer>

  <div id="toast" class="toast" role="status"></div>

  <div id="overlay" class="overlay">
    <div class="card">
      <div id="ov-stars" class="stars"></div>
      <h2 id="ov-title"></h2>
      <p id="ov-text"></p>
      <button id="ov-btn" class="btn primary"></button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
