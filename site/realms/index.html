<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1030" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Crownforge" />
  <meta name="description" content="Crownforge · Five Crowns. Five factions, heroes and armies: explore, build and battle in a 3D fantasy strategy game with a roguelite Crown Run." />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Crownforge · Five Crowns</title>
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <!-- fullscreen: installable app (Add to Home Screen / Install): display fullscreen, landscape -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Nunito:wght@600;800;900&display=swap" />
  <link rel="stylesheet" href="style.css?v=2.5" />
  <script type="importmap">
    { "imports": { "three": "../vendor/three.module.min.js" } }
  </script>
  <!-- three.module.min.js: the official r170 minified build (npm three@0.170.0, verified against the registry tarball;
       same code as three.module.js): 171 KB gzipped instead of 267 KB. -->
  <!-- the whole module graph is fetched in parallel right away instead of import-by-import (4-5 round trips deep:
       main -> its imports -> rig/data -> town + faction modules loaded by top-level await). The URLs must match the
       import specifiers exactly (same ?v=), otherwise the file is fetched twice. -->
  <link rel="modulepreload" href="../vendor/three.module.min.js" />
  <link rel="modulepreload" href="main.js?v=2.5" />
  <link rel="modulepreload" href="materials.js?v=2.5" />
  <link rel="modulepreload" href="rig.js?v=2.5" />
  <link rel="modulepreload" href="rig.js" />
  <link rel="modulepreload" href="data.js?v=2.5" />
  <link rel="modulepreload" href="data.js" />
  <link rel="modulepreload" href="terrain.js?v=2.5" />
  <link rel="modulepreload" href="atmosphere.js?v=2.5" />
  <link rel="modulepreload" href="nature.js?v=2.5" />
  <link rel="modulepreload" href="models.js?v=2.5" />
  <link rel="modulepreload" href="models_towns.js?v=2.5" />
  <link rel="modulepreload" href="models_objects.js?v=2.5" />
  <link rel="modulepreload" href="units_haven.js?v=2.5" />
  <link rel="modulepreload" href="units_haven_up.js?v=2.5" />
  <link rel="modulepreload" href="units_necro.js?v=2.5" />
  <link rel="modulepreload" href="units_necro_up.js?v=2.5" />
  <link rel="modulepreload" href="units_neutral.js?v=2.5" />
  <link rel="modulepreload" href="units_sylvan.js?v=2.5" />
  <link rel="modulepreload" href="units_inferno.js?v=2.5" />
  <link rel="modulepreload" href="units_dungeon.js?v=2.5" />
  <link rel="modulepreload" href="battlefield.js?v=2.5" />
  <link rel="modulepreload" href="battle.js?v=2.5" />
  <link rel="modulepreload" href="town_view.js?v=2.5" />
  <link rel="modulepreload" href="haven_town.js?v=2.5" />
  <link rel="modulepreload" href="necro_town.js?v=2.5" />
  <link rel="modulepreload" href="sylvan_town.js?v=2.5" />
  <link rel="modulepreload" href="inferno_town.js?v=2.5" />
  <link rel="modulepreload" href="dungeon_town.js?v=2.5" />
  <link rel="modulepreload" href="portraits.js?v=2.5" />

  <link rel="modulepreload" href="mapfx.js?v=2.5" />

  <link rel="modulepreload" href="sfx.js?v=2.5" />
  <link rel="modulepreload" href="icons.js" />
  <link rel="modulepreload" href="vport.js?v=2.5" />
  <link rel="modulepreload" href="shell.js?v=2.5" />
</head>
<body>
<div id="app">
  <div id="hud" hidden>
    <div class="rail" aria-hidden="true"></div>
    <header class="resbar">
      <span class="rc rc-gold"><i data-ic="gold" data-size="24"></i><b id="r-gold">0</b></span><span class="rc"><i data-ic="wood" data-size="24"></i><b id="r-wood">0</b></span><span class="rc"><i data-ic="ore" data-size="24"></i><b id="r-ore">0</b></span><span class="rc"><i data-ic="gems" data-size="24"></i><b id="r-gems">0</b></span>
      <em id="r-day"><small>Week 1</small><b>Day 1</b></em>
    </header>
    <nav id="heroes" class="side"></nav>
    <footer class="bottom">
      <div id="sel" class="sel"></div>
      <div class="btns">
        <button id="b-hero" class="fb" aria-label="Hero sheet"><i data-ic="hero" data-size="26"></i><small>Hero</small></button>
        <button id="b-menu" class="fb" aria-label="Menu"><i data-ic="menu" data-size="22"></i><small>Menu</small></button>
        <button id="b-end" class="fb end" aria-label="End the day"><i data-ic="end" data-size="26"></i><small>End day</small></button>
      </div>
    </footer>
  </div>

  <div id="town" class="panel" hidden>
    <input type="checkbox" id="t-fold" class="fold" />
    <label for="t-fold" class="grab" aria-label="Fold the town panel"></label>
    <div class="phead"><div><h2 id="t-name">Town</h2><p id="t-sub"></p></div><label for="t-fold" class="chev" aria-label="Fold"></label><button id="t-close" class="x" aria-label="Close"><i data-ic="close" data-size="18"></i></button></div>
    <div class="tabs2" role="tablist"><button data-t="build" class="on"><i data-ic="build" data-size="18"></i>Build</button><button data-t="recruit"><i data-ic="recruit" data-size="18"></i>Recruit</button><button data-t="army"><i data-ic="army" data-size="18"></i>Army</button><button data-t="more"><i data-ic="tavern" data-size="18"></i>More</button></div>
    <div id="t-body" class="pbody"></div>
    <div class="tfoot"><div id="r2-gold" class="reslist"></div></div>
  </div>

  <div id="battle" hidden>
    <div class="btop"><b id="b-title"></b><em id="b-round">Round 1</em><div id="b-queue" class="bq"></div></div>
    <div class="bbot">
      <p id="b-msg"></p>
      <div class="btns">
        <button id="b-wait" class="fb"><i data-ic="wait" data-size="24"></i><small>Wait</small></button>
        <button id="b-def" class="fb"><i data-ic="defend" data-size="24"></i><small>Defend</small></button>
        <button id="b-spell" class="fb"><i data-ic="spellbook" data-size="24"></i><small>Spells</small></button>
        <button id="b-auto" class="fb"><i data-ic="auto" data-size="24"></i><small>Auto</small></button>
        <button id="b-quick" class="fb"><i data-ic="quick" data-size="24"></i><small>Quick</small></button>
      </div>
    </div>
  </div>
  <div id="blabels"></div>

  <div id="dialog" class="overlay" hidden>
    <div id="dlg-card" class="card">
      <h2 id="dlg-title"></h2>
      <div class="card-scroll">
        <div id="dlg-body"></div>
        <div id="dlg-btns" class="dbtns"></div>
      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <div id="floaters"></div>

  <div id="menu" class="menu">
    <div class="brand">
      <h1 class="logo-full"><img src="art/logo.png" alt="Crownforge" width="367" height="238" draggable="false"></h1>
      <p class="subtitle"><span>FIVE CROWNS</span></p>
    </div>
    <div class="mbtns">
      <button id="m-continue" class="btn gold" hidden>Continue</button>
      <p class="mlabel">Choose a mode</p>
      <div class="modes">
        <button id="m-crown" class="mode crown" style="--fc:#e8b030"><span class="md-crest"><i data-ic="victory" data-size="30"></i></span><span class="md-body"><b>Crown Run</b><small>Roguelite: legends, artifacts, invasions</small></span></button>
        <button id="m-new" class="mode free" style="--fc:#3a7aff"><span class="md-crest"><i data-ic="attack" data-size="30"></i></span><span class="md-body"><b>Free Play</b><small>Classic skirmish, 1–4 rival crowns</small></span></button>
      </div>
      <div class="mfoot"><button id="m-sound" class="chipbtn"><i data-ic="music" data-size="18"></i><span>Music on</span></button><small>v2.5</small></div>
    </div>
  </div>
</div>
<div id="factions" class="factions" hidden></div>
<div id="loader" hidden><div class="ld-card"><img class="ld-logo" src="art/logo.png" alt="Crownforge" width="367" height="238" draggable="false"><p class="ld-sub"><span>FIVE CROWNS</span></p><div class="ld-track"><i id="ld-bar"></i></div><p id="ld-text">Loading…</p></div></div>
<script>
  // self-update: a cached page reloads itself when a newer build is live (GitHub Pages caches HTML ~10 min)
  (function () {
    var BUILD = '2.5';
    var sw = navigator.serviceWorker, local = /^(localhost|127\.|\[::1\])/.test(location.hostname) && !/[?&]sw=1/.test(location.search);
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.version && j.version !== BUILD && sessionStorage.getItem('realms.reload') !== j.version) {
        sessionStorage.setItem('realms.reload', j.version);
        location.replace(location.pathname + '?v=' + encodeURIComponent(j.version));
        return;
      }
      // kill switch: { "sw": false } in version.json removes the worker and its caches
      if (!sw) return;
      if (j && j.sw === false) { sw.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }); if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { if (k.indexOf('orbis-') === 0) caches.delete(k); }); }); return; }
      // long-term asset cache (sw.js): versioned files cache-first, audio + three.js stale-while-revalidate.
      // Registered a little after load so it never competes with the first boot; not on localhost (dev edits keep
      // their ?v=) unless the URL has ?sw=1.
      var reg = function () { setTimeout(function () { sw.register('sw.js?b=' + encodeURIComponent(BUILD)).catch(function () {}); }, 3000); };
      if (!local) { if (document.readyState === 'complete') reg(); else addEventListener('load', reg); }
    }).catch(function () {});
  })();
</script>
<!-- fullscreen: the virtual viewport first (turns the game frame on a portrait screen before anything lays out), then the app shell -->
<script type="module" src="vport.js?v=2.5"></script>
<script type="module" src="shell.js?v=2.5"></script>
<script type="module" src="icons.js"></script>
<script type="module" src="main.js?v=2.5"></script>
</body>
</html>
