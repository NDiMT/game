<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5db8ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SPASE!">
<meta name="description" content="A silly, relaxing destruction toy. Throw things, smash glass, bricks and metal.">
<title>SPASE! - smash stuff</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "cannon-es": "./vendor/cannon-es.js" } }</script>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="top">
    <div id="score"><b id="num">0</b><span>smashed</span><i id="prog"><u id="progv"></u></i></div>
    <div id="btns">
      <button id="bNew" aria-label="New scene" title="New scene"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7" /><path d="M20 4v7h-7" /></svg></button>
      <button id="bMute" aria-label="Mute" title="Sound on/off"><svg viewBox="0 0 24 24"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z" /><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /><path class="x" d="M16 9l6 6M22 9l-6 6" /></svg></button>
    </div>
  </div>
  <div id="combo"></div>
  <div id="banner"><span>CLEARED!</span></div>
  <div id="hint"><span class="hand"></span>Swipe to throw</div>
  <div id="bar">
    <button data-k="ball" aria-label="Ball"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="#ff4a3d" /><circle cx="12" cy="12" r="3.5" fill="#fff" opacity=".45" /></svg></button>
    <button data-k="brick" aria-label="Brick"><svg viewBox="0 0 32 32"><rect x="4" y="10" width="24" height="12" rx="1.5" fill="#c4573a" /><path d="M4 16h24M16 10v6M10 16v6M22 16v6" stroke="#8d3a24" stroke-width="1.4" /></svg></button>
    <button data-k="bowling" aria-label="Bowling ball"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="#2b4fd8" /><circle cx="14" cy="11" r="1.8" fill="#0a0f2a" /><circle cx="19" cy="11.5" r="1.8" fill="#0a0f2a" /><circle cx="16.5" cy="15.5" r="1.8" fill="#0a0f2a" /></svg></button>
    <button data-k="anvil" aria-label="Anvil"><svg viewBox="0 0 32 32"><path d="M3 9h21l5 1v4h-6l-3 3v3h3v4H9v-4h3v-3l-4-3H3z" fill="#3b414b" /></svg></button>
    <button data-k="bomb" aria-label="Bomb"><svg viewBox="0 0 32 32"><circle cx="14" cy="19" r="9" fill="#23252b" /><path d="M19 11l3-3" stroke="#9aa3ad" stroke-width="2.5" /><circle cx="24" cy="6" r="3" fill="#ffb02e" /><circle cx="24" cy="6" r="1.4" fill="#fff6c8" /></svg></button>
  </div>
  <div id="splash"><h1>SPASE!</h1><p>throw stuff. break stuff.</p></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
