<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a2019">
<meta name="description" content="RAISE — σόλο χαρτοπαίγνιο: η ιεραρχία των χεριών πόκερ παιγμένη ως σκάλα που ανεβαίνει.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RAISE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>RAISE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Fira+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="grain"></div><div id="vig"></div>
<canvas id="fx"></canvas>

<div class="app">
  <header class="hud">
    <div class="hud__score"><b id="score">0</b><span id="tgt">/ 100</span></div>
    <div class="hud__r">
      <span class="ante">ANTE <b id="ante">1</b>/8</span>
      <span class="coin"><span id="money">0</span>◎</span>
      <div class="breaths" id="breaths"></div>
    </div>
    <div class="meter"><i id="fill"></i></div>
  </header>

  <main class="table" id="table">
    <div class="rung">
      <span class="lbl">Σκαλί</span>
      <b class="rung__val free" id="rungVal">ελεύθερο</b>
      <div class="rung__dots" id="rungDots"></div>
    </div>
    <div class="tcards" id="tcards"></div>
    <div class="tfoot">
      <span class="tnote" id="tnote"></span>
      <div class="chain" id="chain"><span>Αλυσίδα</span><b id="chainN">×1</b></div>
    </div>
  </main>

  <section class="hand" id="hand" aria-label="Το χέρι σου"></section>

  <div class="tools" id="tools"></div>

  <nav class="dock">
    <button class="rb" id="bHint" aria-label="Πρόταση"><span class="ic">?</span><span>Ιδέα</span></button>
    <button class="rb" id="bPass"><span>Πάσο</span><em id="passN">3</em></button>
    <button class="go idle" id="bPlay" disabled><span class="go__t">Διάλεξε φύλλα</span></button>
    <button class="rb" id="bMenu" aria-label="Μενού"><span class="ic">⋯</span></button>
  </nav>
</div>

<div class="veil" id="veil" hidden><div class="sheet" id="sheet"></div></div>

<script src="game.js"></script>
<script src="fx.js"></script>
<script src="ui.js"></script>
<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost"))
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
