<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3d8fe0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SPASE!">
<meta name="description" content="A silly, relaxing destruction toy. Throw things, smash glass, bricks, metal and appliances.">
<title>SPASE! - smash stuff</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "cannon-es": "./vendor/cannon-es.js" } }</script>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="vig"></div>
  <div id="top">
    <div id="score">
      <div class="row"><b id="num">0</b><span>smashed</span></div>
      <i id="prog"><u id="progv"></u></i>
    </div>
    <div id="btns">
      <button id="bNew" aria-label="New scene" title="New scene"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7" /><path d="M20 4v7h-7" /></svg></button>
      <button id="bMute" aria-label="Sound on or off" title="Sound"><svg viewBox="0 0 24 24"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z" /><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /><path class="x" d="M16 9l6 6M22 9l-6 6" /></svg></button>
    </div>
  </div>
  <div id="combo"><b>x3</b><span id="combosub">CRASH</span></div>
  <div id="banner"><span>CLEARED!</span></div>
  <div class="earn"></div><div class="earn"></div><div class="earn"></div><div class="earn"></div>
  <div id="hint"><span class="hand"></span>Swipe to throw</div>
  <div id="bar">
    <button data-k="ball" aria-label="Ball"><svg viewBox="0 0 32 32"><defs><radialGradient id="gb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff9a8c"/><stop offset=".45" stop-color="#ff4636"/><stop offset="1" stop-color="#b3180e"/></radialGradient></defs><circle cx="16" cy="16" r="11.5" fill="url(#gb)"/><ellipse cx="12" cy="11" rx="3.5" ry="2.4" fill="#fff" opacity=".55"/></svg><span class="badge inf">∞</span></button>
    <button data-k="brick" aria-label="Brick"><svg viewBox="0 0 32 32"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e47a55"/><stop offset="1" stop-color="#a8422a"/></linearGradient></defs><path d="M4 12l6-3h18v11l-6 3H4z" fill="#7d3020"/><rect x="4" y="12" width="18" height="11" rx="1.2" fill="url(#gr)"/><path d="M4 12l6-3h18l-6 3z" fill="#f09a74"/></svg><span class="badge">6</span></button>
    <button data-k="bowling" aria-label="Bowling ball"><svg viewBox="0 0 32 32"><defs><radialGradient id="gw" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#8aa6ff"/><stop offset=".5" stop-color="#2d52e0"/><stop offset="1" stop-color="#14248a"/></radialGradient></defs><circle cx="16" cy="16" r="11.5" fill="url(#gw)"/><circle cx="14" cy="11" r="1.9" fill="#0a0f2a"/><circle cx="19.2" cy="11.6" r="1.9" fill="#0a0f2a"/><circle cx="16.6" cy="15.8" r="1.9" fill="#0a0f2a"/></svg><span class="badge">3</span></button>
    <button data-k="anvil" aria-label="Anvil"><svg viewBox="0 0 32 32"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d8794"/><stop offset="1" stop-color="#2c3139"/></linearGradient></defs><path d="M2.5 9h21l6 1.2v3.8h-6.5l-3 3v3h3v4.5H8.5V20h3v-3l-4.5-3H2.5z" fill="url(#ga)"/><path d="M2.5 9h21l6 1.2" stroke="#c6ced8" stroke-width="1.2" fill="none"/></svg><span class="badge">1</span></button>
    <button data-k="bomb" aria-label="Bomb"><svg viewBox="0 0 32 32"><defs><radialGradient id="gm" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#6b7180"/><stop offset=".5" stop-color="#25282f"/><stop offset="1" stop-color="#0b0c0f"/></radialGradient></defs><circle cx="14" cy="19" r="9.5" fill="url(#gm)"/><rect x="16.5" y="8.5" width="5" height="4" rx="1" transform="rotate(40 19 10.5)" fill="#9aa3ad"/><path d="M21 8c1-2 3-3 4.5-2.5" stroke="#c9a46a" stroke-width="1.6" fill="none"/><circle cx="25.5" cy="5.5" r="2.8" fill="#ffb02e"/><circle cx="25.5" cy="5.5" r="1.3" fill="#fff6c8"/></svg><span class="badge">1</span></button>
  </div>
  <div id="fade"></div>
  <div id="splash"><div class="logo"><h1>SPASE!</h1><p>throw stuff. break stuff.</p></div><i class="load"></i></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
